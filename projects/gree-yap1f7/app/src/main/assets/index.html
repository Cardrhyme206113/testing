</svg><div id="toast" class="toast" role="status"></div></main><script>
'use strict';
const MODES=[{name:'Auto',id:0},{name:'Cool',id:1},{name:'Dry',id:2},{name:'Fan',id:3},{name:'Heat',id:4}];
const DEFAULT={power:true,temp:30,mode:4,fan:3,turbo:false,sleep:false,light:true,wifi:false,ifeel:false,swingV:1,swingH:0,displayTemp:0,timerOff:0,clock:'12:08'};
let state={...DEFAULT};
try {const saved=JSON.parse(localStorage.getItem('gree-yap1f7-state')||'{}'); state={...state,...saved};}catch(e){}
const $=x=>document.getElementById(x);
const SEGS={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgecd',7:'abc',8:'abcdefg',9:'abfgcd'};
// Dark active LCD segments, faint inactive outlines, sloped to resemble original segmented glass.
function drawDigit(n, x, lit=true) {
  const active=SEGS[n]||SEGS[0];
  const shapes={
    a:'4,0 32,0 28,5 8,5', b:'34,2 39,7 38,33 33,37 30,33 31,8',
    c:'33,43 38,47 37,74 32,79 29,73 30,48', d:'6,76 31,76 27,82 10,82',
    e:'1,43 6,46 5,72 1,78 -3,74 -2,48', f:'2,5 7,8 6,33 1,38 -2,34 -1,10',
    g:'5,38 30,38 34,41 28,45 7,44 2,41'
  };
  return `<g transform="translate(${x} 0)">${Object.entries(shapes).map(([s,p])=>`<polygon points="${p}" fill="${'#27322d'}" opacity="${active.includes(s)&&lit?'1':'.30'}"/>`).join('')}</g>`;
}
// A segment test is local display inspection only. It never sends IR.
const segmentTest=new URLSearchParams(location.search).has('segments');
let healthAir=0, sending=false, signalTimer;
const demoFeatures=new Set();
function drawLCD(){
  const flags={fan:true,fanAuto:state.fan===0,oper:state.power,wifi:state.wifi,
    signal:sending,degC:true,clock:true,timerOff:state.timerOff>0,hour:state.timerOff>0,
    swingH:state.swingH>0,swingV:state.swingV>0,turbo:state.turbo,sleep:state.sleep,
    ifeel:state.ifeel,health:healthAir===2||healthAir===3,air:healthAir===1||healthAir===2,
    tempSet:state.displayTemp!==0,tempIn:state.displayTemp===2,tempOut:state.displayTemp===3};
  for(const id of demoFeatures) flags[id]=true;
  flags.degC=!flags.degF;
  flags['mode'+state.mode]=true;
  const bars=[0,2,3,5][state.fan];
  for(let i=0;i<5;i++) flags['bar'+i]=i<bars;
  for(const id of ["mode0", "mode1", "mode2", "mode3", "mode4", "fan", "fanAuto", "bar0", "bar1", "bar2", "bar3", "bar4", "signal", "oper", "wifi", "tempSet", "tempIn", "tempOut", "degF", "degC", "health", "air", "xfan", "ifeel", "lock", "quietAuto", "quiet", "turbo", "sleep", "sleepType", "heat8", "limit", "clock", "hour", "timerOn", "timerOff", "swingV", "swingH"]) {
    $('lcd-'+id).setAttribute('opacity',segmentTest||(state.power&&flags[id])?'1':'.30');
  }
  const temp=segmentTest?'88':String(flags.degF?Math.round((state.mode===0?25:state.temp)*9/5+32):state.mode===0?25:state.temp);
  $('tempDigits').innerHTML=temp.split('').map((n,i)=>drawDigit(+n,i*48,segmentTest||state.power)).join('');
  const clockParts=(segmentTest?'88:88':state.timerOff?String(Math.floor(state.timerOff/60)).padStart(2,'0')+':'+String(state.timerOff%60).padStart(2,'0'):state.clock).split('');
  $('clockLCD').innerHTML=clockParts.map((n,i)=>n===':'?'<path fill="#27322d" d="M94 26h7v8h-7z M94 54h7v8h-7z"/>':drawDigit(+n,i*46-(i>2?26:0),segmentTest||state.power)).join('');
  for(const key of ['power','turbo','ifeel','light','wifi','sleep']) {
    document.querySelector('[data-key="'+key+'"]').setAttribute('aria-pressed',String(state[key]));
  }
  $('clockLCD').setAttribute('data-powered',String(segmentTest||state.power));
}
let toastTimer;
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700);}
window.irResponse=function(message,ok){if(!ok) toast(message);};
function transmit(key){
  localStorage.setItem('gree-yap1f7-state',JSON.stringify(state));
  drawLCD();
  if(typeof Android!=='undefined'&&Android.send){try{Android.send(JSON.stringify({...state,key}));sending=true;clearTimeout(signalTimer);drawLCD();signalTimer=setTimeout(()=>{sending=false;drawLCD()},220);}catch(e){toast('IR error: '+e.message);}}
  else toast('UI preview · Infrared requires the Android app');
}
function act(key){
  if(segmentTest){toast('LCD segment test');return;}
  let msg=''; let send=true;
  switch(key){
    case 'power': state.power=!state.power; break;
    case 'up': if(state.mode===0){msg='AUTO keeps temperature at 25°C';send=false;}else state.temp=Math.min(30,state.temp+1);break;
    case 'down':if(state.mode===0){msg='AUTO keeps temperature at 25°C';send=false;}else state.temp=Math.max(16,state.temp-1);break;
    case 'mode':state.mode=(state.mode+1)%5;if(state.mode===0)state.temp=25;if(state.mode===2)state.fan=1;break;
    case 'fan':state.fan=(state.fan+1)%4;if(state.mode===2)state.fan=1;state.turbo=false;break;
    case 'turbo':state.turbo=!state.turbo;break;
    case 'swingH':state.swingH=(state.swingH+1)%7;break;
    case 'swingV':state.swingV=state.swingV===1?0:1;break;
    case 'ifeel':state.ifeel=!state.ifeel;break;
    case 'timer':state.timerOff=(state.timerOff+30)%(24*60+30);msg=state.timerOff?`OFF timer: ${state.timerOff/60} h`:'OFF timer cleared';break;
    case 'health':healthAir=(healthAir+1)%4;msg='Health/Air: IR command not mapped';send=false;break;
    case 'tempDisplay':state.displayTemp=(state.displayTemp+1)%4;break;
    case 'clock':{const d=new Date(); state.clock=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');msg='Clock set from phone';send=false;break;}
    case 'light':state.light=!state.light;break;
    case 'wifi':state.wifi=!state.wifi;break;
    case 'sleep':state.sleep=!state.sleep;break;
    default:return;
  }
  if(navigator.vibrate)navigator.vibrate(8);
  if(msg)toast(msg);
  if(send)transmit(key);else { localStorage.setItem('gree-yap1f7-state',JSON.stringify(state));drawLCD(); }
}
for(const el of document.querySelectorAll('.button')){
  el.addEventListener('click',()=>act(el.dataset.key));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(el.dataset.key)}});
}
// Keep the exact physical layout; a long hold on GREE offers a hidden diagnostic model switch.
const logo=$('logo');
let pressTimer;
logo.addEventListener('pointerdown',()=>{pressTimer=setTimeout(()=>{if(typeof Android!=='undefined'&&Android.cycleModel){toast(Android.cycleModel());}else toast('Android IR model setting');},1000);});
logo.addEventListener('pointerup',()=>clearTimeout(pressTimer));
logo.addEventListener('pointercancel',()=>clearTimeout(pressTimer));
// Browser-only inspection of extra LCD indicators, independent of the IR payload.
if(typeof Android==='undefined'&&!segmentTest){
  for(const id of ['lock', 'xfan', 'quiet', 'quietAuto', 'heat8', 'limit', 'sleepType', 'timerOn', 'degF']){
    const indicator=$('lcd-'+id);
    const names={degF:'Fahrenheit',xfan:'X-FAN',lock:'Child lock',quiet:'Quiet',quietAuto:'Auto quiet',heat8:'8 degree heating',limit:'Power limit',sleepType:'Sleep type',timerOn:'Timer on'};
    indicator.setAttribute('role','button');
    indicator.setAttribute('tabindex','0');
    indicator.setAttribute('aria-label',names[id]+' display preview');
    indicator.setAttribute('aria-pressed','false');
    function toggle(){
      if(demoFeatures.has(id)) demoFeatures.delete(id); else demoFeatures.add(id);
      indicator.setAttribute('aria-pressed',String(demoFeatures.has(id)));
      drawLCD();
      toast(names[id]+' · display preview');
    }
    indicator.addEventListener('click',toggle);
    indicator.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  }
}
drawLCD();
// Warn early when Android is present but the handset has no accessible IR transmitter.
try { if (typeof Android !== 'undefined' && Android.hasIrEmitter && !Android.hasIrEmitter()) {
  setTimeout(() => toast('No IR emitter detected on this phone'), 350);
} } catch(e) {}
</script></body></html>
