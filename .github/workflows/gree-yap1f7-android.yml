name: Gree YAP1F7 · Build Android APK
on:
  push:
    branches: [gree-yap1f7-android]
    paths:
      - 'projects/gree-yap1f7/**'
      - '.github/workflows/gree-yap1f7-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/gree-yap1f7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2 from direct CDN
        run: |
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 30 'https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip' -o "$RUNNER_TEMP/gradle-8.10.2.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.10.2.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Test & compile APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gree-YAP1F7-debug-APK
          path: projects/gree-yap1f7/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
