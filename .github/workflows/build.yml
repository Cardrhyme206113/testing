name: Build BlockHost native APK

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Fetch ARM64 PRoot launcher
        run: bash scripts/fetch-proot.sh
      - name: Apply Android and PRoot compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/example/blockhost')
          p = root / 'ServerRepository.java'
          s = p.read_text()
          pairs = {
            'Files.readString(stateFile.toPath(), StandardCharsets.UTF_8)': 'FileIo.readUtf8(stateFile)',
            'Files.readString(file.toPath(), StandardCharsets.UTF_8)': 'FileIo.readUtf8(file)',
            'Files.writeString(file.toPath(), content, StandardCharsets.UTF_8)': 'FileIo.writeUtf8(file, content)',
            'Files.writeString(tmp.toPath(), state.toString(2), StandardCharsets.UTF_8)': 'FileIo.writeUtf8(tmp, state.toString(2))',
            'Files.writeString(stateFile.toPath(), state.toString(2), StandardCharsets.UTF_8)': 'FileIo.writeUtf8(stateFile, state.toString(2))',
            'Files.writeString(file.toPath(), text, StandardCharsets.UTF_8)': 'FileIo.writeUtf8(file, text)',
            'file.isFile() ? Files.readString(file.toPath(), StandardCharsets.UTF_8) : ""': 'file.isFile() ? FileIo.readUtf8(file) : ""',
          }
          for old, new in pairs.items():
            s = s.replace(old, new)
          p.write_text(s)
          p = root / 'MinecraftServerService.java'
          p.write_text(p.read_text().replace('processStats.sample(process.pid())', 'processStats.sample(ProcessId.get(process))'))
          PY
          python3 scripts/patch-proot-runtime-v16.py
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Verify small APK
        shell: bash
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          ! unzip -l "$apk" | grep -q 'runtime-aarch64'
          test "$(stat -c%s "$apk")" -lt 50000000
          ls -lh "$apk"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlockHost-native-build-log
          path: build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlockHost-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
