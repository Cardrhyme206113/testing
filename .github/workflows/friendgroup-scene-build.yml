name: Build Friend Group Scene 1.21.9

on:
  push:
    branches: [ friendgroup-scene-1.21.9-build ]
    paths:
      - 'friendgroup-scene/**'
      - '.github/workflows/friendgroup-scene-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'friendgroup-scene/**'
      - '.github/workflows/friendgroup-scene-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: friendgroup-scene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: FriendGroupScene-1.21.9
          path: |
            friendgroup-scene/build/libs/*.jar
          if-no-files-found: error
