name: Inspect Pufferfish downloads

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Pufferfish Jenkins jobs
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0 BlockHost/0.5'}
          root='https://ci.pufferfish.host/api/json?tree=jobs[name,url,color]'
          data=json.load(urllib.request.urlopen(urllib.request.Request(root,headers=headers),timeout=60))
          open('pufferfish-jobs.json','w').write(json.dumps(data,indent=2))
          print('JOBS')
          for job in data.get('jobs',[]): print(job.get('name'),job.get('url'),job.get('color'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pufferfish-download-inspection
          path: pufferfish-jobs.json
