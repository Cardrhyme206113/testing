name: Inspect Pufferfish downloads

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect downloads page and scripts
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import html, re, urllib.parse, urllib.request
          page='https://pufferfish.host/downloads'
          req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0 BlockHost/0.4'})
          raw=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          open('pufferfish-page.html','w').write(raw)
          print('PAGE_BYTES',len(raw))
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',raw,re.I):
              url=urllib.parse.urljoin(page,html.unescape(src))
              scripts.append(url)
          print('SCRIPTS',len(scripts))
          combined=[]
          for i,url in enumerate(scripts):
              print('SCRIPT',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 BlockHost/0.4'})
                  data=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
                  open(f'script-{i}.js','w').write(data)
                  combined.append(data)
              except Exception as e: print('SCRIPT_ERROR',url,repr(e))
          corpus='\n'.join([raw]+combined)
          patterns=[r'https?://[^"\'\\\s<>]+',r'/api/[^"\'\\\s<>]+',r'[^"\'\\\s<>]*\.jar[^"\'\\\s<>]*',r'[^"\'\\\s<>]*(?:download|build)[^"\'\\\s<>]*']
          found=[]
          for p in patterns:
              for x in re.findall(p,corpus,re.I):
                  x=html.unescape(x)
                  if x not in found: found.append(x)
          print('=== CANDIDATES ===')
          for x in found:
              if any(k in x.lower() for k in ['puffer','download','build','jar','api','jenkins','ci.']): print(x[:1000])
          open('pufferfish-candidates.txt','w').write('\n'.join(found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pufferfish-download-inspection
          path: |
            pufferfish-page.html
            pufferfish-candidates.txt
            script-*.js
