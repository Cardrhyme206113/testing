name: Inspect Pufferfish downloads

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Pufferfish Jenkins build
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import io, json, re, urllib.request, zipfile

          job='Pufferfish-1.21'
          api=f'https://ci.pufferfish.host/job/{job}/api/json?tree=builds[number,status,timestamp,id,result,changeSet[items[comment,commitId]],artifacts[*]]'
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0 BlockHost/0.5'})
          data=json.load(urllib.request.urlopen(req,timeout=60))
          open('pufferfish-builds.json','w').write(json.dumps(data,indent=2))
          build=next((b for b in data.get('builds',[]) if b.get('result')=='SUCCESS' and b.get('artifacts')),None)
          if not build: raise SystemExit('No successful Pufferfish build with an artifact')
          artifact=build['artifacts'][0]['relativePath']
          url=f'https://ci.pufferfish.host/job/{job}/{build["number"]}/artifact/{artifact}'
          print('LATEST_BUILD',build['number'])
          print('ARTIFACT',artifact)
          print('DOWNLOAD_URL',url)
          print('CHANGES')
          for item in build.get('changeSet',{}).get('items',[]):
              print(item.get('commitId','')[:12],repr(item.get('comment','')))
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 BlockHost/0.5'})
          raw=urllib.request.urlopen(req,timeout=180).read()
          open('pufferfish-latest.jar','wb').write(raw)
          print('JAR_BYTES',len(raw))
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=z.namelist()
              open('pufferfish-jar-list.txt','w').write('\n'.join(names))
              print('JAR_ENTRIES',len(names))
              for name in names:
                  low=name.lower()
                  if any(x in low for x in ['manifest.mf','version.json','versions.list','patch.properties','paperclip']):
                      try:
                          value=z.read(name)
                          if len(value)<100000:
                              text=value.decode('utf-8','replace')
                              print('===',name,'===')
                              print(text[:10000])
                      except Exception as e: print('READ_ERROR',name,repr(e))
              matches=[]
              for name in names:
                  try:
                      if z.getinfo(name).file_size>2_000_000: continue
                      value=z.read(name)
                      if b'1.21.11' in value or b'1.21.8' in value:
                          matches.append(name)
                  except Exception: pass
              print('VERSION_MATCH_FILES',matches[:100])
          open('pufferfish-download-url.txt','w').write(url+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pufferfish-download-inspection
          path: |
            pufferfish-builds.json
            pufferfish-download-url.txt
            pufferfish-jar-list.txt
