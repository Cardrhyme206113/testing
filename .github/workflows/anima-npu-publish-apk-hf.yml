name: Publish Anima Pocket v0.6.1 APK directly to private Hugging Face
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anima-npu-publish-apk-hf.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload-direct-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: cardrhyme/anima-turbo-v1.1-mt6989-a16w4-experimental
      APK_NAME: AnimaPocket-v0.6.1-NPU-Isolated-Diagnostics.apk
    steps:
      - name: Verify private HF upload token
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN repository secret"; exit 1; }

      - name: Retrieve the successfully built NPU-enabled APK
        uses: actions/download-artifact@v4
        with:
          run-id: 40068501189
          github-token: ${{ github.token }}
          name: AnimaPocket-v0.6.0-NPU-A16W4-Test-APK
          path: download

      - name: Verify artifact and rename APK for its actual package version
        run: |
          test -s download/app-release.apk
          unzip -tqq download/app-release.apk
          unzip -l download/app-release.apk | grep -q 'lib/arm64-v8a/libneuron_backend.so'
          unzip -l download/app-release.apk | grep -q 'lib/arm64-v8a/libneuronusdk_adapter.mtk.so'
          mkdir -p publish
          cp download/app-release.apk "publish/$APK_NAME"

      - name: Upload one-click APK into user's private model repository
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub>=0.34,<2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_REPO_ID']
          name = os.environ['APK_NAME']
          api.upload_file(
              path_or_fileobj='publish/' + name,
              path_in_repo='apks/' + name,
              repo_id=repo,
              repo_type='model',
              commit_message='Add Anima Pocket v0.6.1 isolated NPU crash diagnostics APK',
          )
          print('Direct APK: https://huggingface.co/' + repo + '/resolve/main/apks/' + name + '?download=true')
          PY
