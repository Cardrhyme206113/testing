name: Build Phone Motion Server APK

on:
  push:
    branches: [phone-motion-server]
    paths:
      - 'phone-motion-server/app/**'
      - 'phone-motion-server/build.gradle.kts'
      - 'phone-motion-server/settings.gradle.kts'
      - 'phone-motion-server/README.md'
      - '.github/workflows/phone-motion-server-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'phone-motion-server/app/**'
      - 'phone-motion-server/build.gradle.kts'
      - 'phone-motion-server/settings.gradle.kts'
      - 'phone-motion-server/README.md'
      - '.github/workflows/phone-motion-server-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record this build run ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/phone-motion-server'
        run: |
          set -euo pipefail
          mkdir -p phone-motion-server/releases
          printf '%s\n' "$GITHUB_RUN_ID" > phone-motion-server/releases/run-id.txt
          printf '%s\n' "$GITHUB_SHA" > phone-motion-server/releases/source-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phone-motion-server/releases/run-id.txt phone-motion-server/releases/source-sha.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record APK build run $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:phone-motion-server
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        working-directory: phone-motion-server
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Stage APK in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/phone-motion-server'
        run: |
          set -euo pipefail
          cp phone-motion-server/app/build/outputs/apk/debug/app-debug.apk phone-motion-server/releases/motion-server-debug.apk
          sha256sum phone-motion-server/releases/motion-server-debug.apk | awk '{print $1}' > phone-motion-server/releases/motion-server-debug.apk.sha256
          git add phone-motion-server/releases/motion-server-debug.apk phone-motion-server/releases/motion-server-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Build Motion Server APK [skip ci]"
            git push origin HEAD:phone-motion-server
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-server-debug-apk
          path: phone-motion-server/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
