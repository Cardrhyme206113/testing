name: Build Phone Motion Server APK

on:
  push:
    branches: [phone-motion-server]
    paths:
      - 'phone-motion-server/**'
      - '.github/workflows/phone-motion-server-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        working-directory: phone-motion-server
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: motion-server-debug-apk
          path: phone-motion-server/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
