name: Build EquirectShot 26.2

on:
  push:
    branches: [ equirectshot-26.2 ]
    paths:
      - 'equirectshot/**'
      - '.github/workflows/equirectshot-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equirectshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EquirectShot-26.2
          path: |
            equirectshot/build/libs/equirectshot-26.2-1.0.0.jar
          if-no-files-found: error
