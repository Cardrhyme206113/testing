name: Build EquirectShot 1.21.9

on:
  push:
    branches: [ equirectshot-1.21.9-build ]
    paths:
      - 'equirectshot/**'
      - '.github/workflows/equirectshot-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'equirectshot/**'
      - '.github/workflows/equirectshot-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equirectshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: EquirectShot-1.21.9
          path: |
            equirectshot/build/libs/*.jar
          if-no-files-found: error
