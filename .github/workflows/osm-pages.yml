name: OSM compression Pages viewer

on:
  push:
    branches: [osm-compression-lab]
    paths:
      - 'osm-compression/viewer/**'
      - '.github/workflows/osm-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_RUN: '32358740755'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: osm-compression-lab

      - name: Assemble static site without committing huge map files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p site/data tmp/compact tmp/lean tmp/balanced tmp/results
          cp osm-compression/viewer/index.html site/index.html

          gh run download "$SOURCE_RUN" -n turkey-compact-pmtiles -D tmp/compact
          gh run download "$SOURCE_RUN" -n turkey-lean-pmtiles -D tmp/lean
          gh run download "$SOURCE_RUN" -n turkey-balanced-pmtiles -D tmp/balanced
          gh run download "$SOURCE_RUN" -n osm-compression-results -D tmp/results

          cp tmp/compact/compact.pmtiles site/data/compact.pmtiles
          cp tmp/lean/lean.pmtiles site/data/lean.pmtiles
          cp tmp/balanced/balanced.pmtiles site/data/balanced.pmtiles
          cp tmp/results/stats-all.json site/data/stats-all.json
          cp tmp/results/istanbul-comparison.png site/data/istanbul-comparison.png
          cp tmp/results/istanbul-reference.png site/data/istanbul-reference.png
          cp tmp/results/istanbul-compact.png site/data/istanbul-compact.png
          cp tmp/results/istanbul-lean.png site/data/istanbul-lean.png
          cp tmp/results/istanbul-balanced.png site/data/istanbul-balanced.png
          cp tmp/results/report.md site/data/report.md
          touch site/.nojekyll
          du -sh site site/data/*

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        run: |
          printf '%s\n' '${{ steps.deployment.outputs.page_url }}' > osm-compression/viewer-deployment.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add osm-compression/viewer-deployment.txt
          git diff --cached --quiet || git commit -m 'Record OSM viewer Pages URL'
          git push origin HEAD:osm-compression-lab
