name: Publish screen translator release
on:
  push:
    branches: [feature/paddle-screen-translator]
    paths: [".github/workflows/publish-screen-translator-release.yml"]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/8010051383/zip > a.zip
          unzip -q a.zip -d a
          cp "$(find a -name '*.apk' | head -1)" Screen-Translator-v0.2.0.apk
          gh release upload screen-translator-v0.2.0 Screen-Translator-v0.2.0.apk --clobber || gh release create screen-translator-v0.2.0 Screen-Translator-v0.2.0.apk --target feature/paddle-screen-translator --title "Screen Translator v0.2.0" --notes "Full-resolution Small OCR, NNAPI acceleration, realtime tracking, vertical Japanese reconstruction, and exact-box background matching."
