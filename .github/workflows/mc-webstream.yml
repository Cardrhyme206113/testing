name: MC WebStream Fabric 1.20.1

on:
  push:
    branches: [mc-webstream-fabric-1.20.1]
    paths:
      - 'mc-webstream/**'
      - '.github/workflows/mc-webstream.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Fabric mod
        working-directory: mc-webstream
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: mc-webstream-fabric-1.20.1
          path: mc-webstream/build/libs/*.jar
