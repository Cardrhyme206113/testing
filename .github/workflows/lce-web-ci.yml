name: LCE Web / Emscripten CI

on:
  push:
    branches: [lce-web-ci-20261014]
    paths:
      - ".github/workflows/lce-web-ci.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional direct HTTPS URL to the complete fix63 rooted project ZIP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_URL: ${{ inputs.source_url || vars.LCE_SOURCE_URL || '' }}
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          actions-cache-folder: emsdk-cache
      - name: Show tool versions
        run: |
          emcc --version | head -3
          cmake --version | head -1
          ninja --version
          rustc --version
          node --version
      - name: Compile WebAssembly smoke test
        shell: bash
        run: |
          mkdir -p smoke
          printf '#include <stdio.h>\nint main(void){puts("Emscripten CI works!");return 0;}\n' > smoke/main.c
          emcc smoke/main.c -O2 -sENVIRONMENT=web -o smoke/index.html
          printf 'LCE Emscripten CI smoke build successful\n' > smoke/BUILD-STATUS.txt
      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: lce-emscripten-smoke
          path: smoke/
          if-no-files-found: error
          retention-days: 7
      - name: Fetch verified fix68 sources
        shell: bash
        run: |
          mkdir -p incoming
          python3 - <<'PY'
          import concurrent.futures,hashlib,pathlib,urllib.request,zipfile
          urls=["https://sdmntpritalynorth.oaiusercontent.com/files/00000000-3d04-8246-8200-acd2cf83c7bc/raw?se=2026-10-15T06%3A43%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=27cb684a-a3b2-512c-9c74-9c75883904f2&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A18%3A14Z&ske=2026-10-16T05%3A18%3A14Z&sks=b&skv=2026-02-06&sig=ToD2HYgy4Qv9KLHuUL85BuLaagpU%2B22iYd4RfX5Vi6I%3D","https://sdmntpritalynorth.oaiusercontent.com/files/00000000-fc6c-8246-96e2-eff09cfbea3c/raw?se=2026-10-15T06%3A43%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=d2f3c3f0-6664-5d15-b9b0-83eb8457b406&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A59%3A31Z&ske=2026-10-16T05%3A59%3A31Z&sks=b&skv=2026-02-06&sig=WbutrvucpzdJ4OVkBIDyJdi0A2SU8bHZFh8Uo6t35aA%3D","https://sdmntprnortheu.oaiusercontent.com/files/00000000-fc94-81f4-9982-2b3dc999bb12/raw?se=2026-10-15T06%3A43%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=bbd2c3e4-330e-5f1a-83bd-8c6168885294&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T03%3A26%3A32Z&ske=2026-10-16T03%3A26%3A32Z&sks=b&skv=2026-02-06&sig=bObnm4WaH87cMI9fi8LIH6wy/tFfK43q0zsWK14SXdQ%3D","https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0740-8210-9861-1299c0899de8/raw?se=2026-10-15T06%3A43%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=a3ec2029-844f-5a2a-aacc-dcca45e692a8&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T04%3A05%3A17Z&ske=2026-10-16T04%3A05%3A17Z&sks=b&skv=2026-02-06&sig=KiPSgMIYi%2BaVX1S/OUAwa4ipOjJ3DZb6QoR38sgi1Xc%3D","https://sdmntpritalynorth.oaiusercontent.com/files/00000000-d71c-8246-bb77-bbc52dfcb6f2/raw?se=2026-10-15T06%3A43%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=01e913da-b26c-5fb7-9444-80cf43463006&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T02%3A41%3A15Z&ske=2026-10-16T02%3A41%3A15Z&sks=b&skv=2026-02-06&sig=qqqapXEZWeyIGkS0jpx4pDnn3VsF0Zxv3c99YMgQvz4%3D","https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-807c-8210-8f0c-f9222c9b596c/raw?se=2026-10-15T06%3A43%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=0ffebb5c-c006-504c-a4be-244caad99d4e&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A07%3A33Z&ske=2026-10-16T05%3A07%3A33Z&sks=b&skv=2026-02-06&sig=/xKynUi2L/3QbjStKnABmmToLi4Pk2ZxyIbhtQ%2BZOEs%3D","https://sdmntprukwest.oaiusercontent.com/files/00000000-f894-8243-b29f-b5cfc1213f76/raw?se=2026-10-15T06%3A44%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=d26af39d-d7b3-5b2b-81d4-f52c9e23dcd7&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T02%3A22%3A48Z&ske=2026-10-16T02%3A22%3A48Z&sks=b&skv=2026-02-06&sig=KYI32n8wQHx3dMNiEX454OHWTlZCS9QWeNI2mudtpf8%3D","https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ba4c-8210-b3dd-822398aacbbe/raw?se=2026-10-15T06%3A44%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=ff5e6bed-0a93-5508-95cf-115883d55947&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T02%3A28%3A15Z&ske=2026-10-16T02%3A28%3A15Z&sks=b&skv=2026-02-06&sig=Mn6KpWEu3rNHgFmfHF16eDh65vn8Si06bNgzn9CxzzY%3D","https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b0dc-8210-b257-8616df586cbf/raw?se=2026-10-15T06%3A43%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=6b4c8c6f-2413-52bf-b164-838cd6d37f40&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T06%3A04%3A16Z&ske=2026-10-16T06%3A04%3A16Z&sks=b&skv=2026-02-06&sig=TDIyUx8covo7TL5mRj63ywUQZYZlrA/WhPlyWN6C9A0%3D","https://sdmntprukwest.oaiusercontent.com/files/00000000-0d94-8243-9317-b2a842988269/raw?se=2026-10-15T06%3A44%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=f15aeefe-b6d0-5940-b28f-be016fc87317&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T06%3A14%3A27Z&ske=2026-10-16T06%3A14%3A27Z&sks=b&skv=2026-02-06&sig=5itHRWteM5mz6eRjZ%2BBkwP8ApStrOUEX9q2hB7Z%2B5mg%3D","https://sdmntprnortheu.oaiusercontent.com/files/00000000-5d44-81f4-bd03-737b7a4b1799/raw?se=2026-10-15T06%3A44%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=69f55e91-21df-504d-88be-311fcab764f1&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T06%3A34%3A24Z&ske=2026-10-16T06%3A34%3A24Z&sks=b&skv=2026-02-06&sig=B7jEha%2BLOBmX%2B1Jm8xs8yqGNx3LQp9WoHSxCkynTVOo%3D","https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f1ac-8210-941f-a29c2c19cc64/raw?se=2026-10-15T06%3A44%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=383fa6b5-b3a8-52cd-9b19-8b9906b230c5&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T04%3A18%3A51Z&ske=2026-10-16T04%3A18%3A51Z&sks=b&skv=2026-02-06&sig=9Jee7z2%2BSvbXyfdV82ZhItZPqhQ5cmfyirE00jYumNY%3D","https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8188-8246-9469-4c0034651e95/raw?se=2026-10-15T06%3A44%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=35601475-5306-563b-ac68-4d05a9b83d18&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T03%3A48%3A41Z&ske=2026-10-16T03%3A48%3A41Z&sks=b&skv=2026-02-06&sig=vvvgFsD50bzq3rnKG3MhmDIjZetjfKY4Uz0z1jZ7LxE%3D","https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-3834-820a-94c7-60075fb33caa/raw?se=2026-10-15T06%3A44%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=56a0cb09-74f7-5a42-a9e5-d6fca4c02b2a&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A11%3A17Z&ske=2026-10-16T05%3A11%3A17Z&sks=b&skv=2026-02-06&sig=3GPgqLYJHb%2BQ5AHEinZ9wc6ipc7oiTbMJlX0cZTMiv4%3D","https://sdmntprnortheu.oaiusercontent.com/files/00000000-b2f8-81f4-84c7-938db66e62d0/raw?se=2026-10-15T06%3A44%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=b5230c53-3279-5770-b587-d2fc4daad0f8&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T05%3A58%3A45Z&ske=2026-10-16T05%3A58%3A45Z&sks=b&skv=2026-02-06&sig=gEAIGgSQz78GIcZOsHyiJwoedrOoqmTvv/4V9SoZfn8%3D"]
          d=pathlib.Path('incoming/parts');d.mkdir(parents=True,exist_ok=True)
          def get(i):
              req=urllib.request.Request(urls[i],headers={'User-Agent':'LCE-Web-fix68-CI'})
              with urllib.request.urlopen(req,timeout=240) as r:data=r.read()
              if i<13 and len(data)!=15728640:raise RuntimeError(f'Source chunk {i}: {len(data)} bytes')
              (d/(f'part{i:02d}' if i<14 else 'overlay.zip')).write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:list(pool.map(get,range(len(urls))))
          z=pathlib.Path('incoming/source.zip')
          with z.open('wb') as out:
              for i in range(14):
                  with (d/f'part{i:02d}').open('rb') as stream:
                      while block:=stream.read(1048576):out.write(block)
          with z.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
          if digest!='81d502ccb8d21cbf0af4ca5f099a45fed1a75fb2880fd1c1549a73e2e2c7b8fa':raise SystemExit('Source SHA-256 mismatch: '+digest)
          with zipfile.ZipFile(d/'overlay.zip') as o:
              if o.testzip():raise SystemExit('Corrupt fix68 overlay')
              o.extractall('incoming/overlay')
          print('Verified base and staged fix68 overlay')
          PY
      - name: Get optional LCE source archive
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          if [ -f incoming/source.zip ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SOURCE_URL" ]; then
            case "$SOURCE_URL" in https://*) ;; *) echo "::error::Source URL must use HTTPS"; exit 1 ;; esac
            curl --fail --location --retry 3 --output incoming/source.zip "$SOURCE_URL"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif gh release download lce-web-input --repo "$GITHUB_REPOSITORY" --pattern 'lce-web-work-*.zip' --dir incoming; then
            found="$(find incoming -maxdepth 1 -name 'lce-web-work-*.zip' -type f | head -1)"
            if [ -n "$found" ]; then
              mv "$found" incoming/source.zip
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No LCE source archive configured: smoke only"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack full project
        if: steps.source.outputs.available == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("incoming/source.zip") as z:
              z.testzip() is None or exit(1)
              if not all(n == 'lce-web-work/' or n.startswith('lce-web-work/') for n in z.namelist()):
                  raise SystemExit("Wrong ZIP root; expected lce-web-work/")
              z.extractall(".")
          PY
          test -f lce-web-work/tools/build_web.sh
          test -f lce-web-work/tools/build_ruffle_webiggy.sh
          cp -a incoming/overlay/lce-web-work/. lce-web-work/
          grep -q LCE_WEBIGGY_RUFFLE_PATCH_16 lce-web-work/tools/patch_ruffle_webiggy.py
      - name: Install LCE dependencies
        if: steps.source.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang libpng-dev zlib1g-dev pkg-config
          rustup target add wasm32-unknown-unknown
      - name: Build patched Ruffle WebIggy
        if: steps.source.outputs.available == 'true'
        working-directory: lce-web-work
        shell: bash
        run: |
          chmod +x tools/build_ruffle_webiggy.sh
          ./tools/build_ruffle_webiggy.sh 2>&1 | tee ruffle-build.log
      - name: Build full LCE WebAssembly
        if: steps.source.outputs.available == 'true'
        working-directory: lce-web-work
        shell: bash
        run: |
          chmod +x tools/build_web.sh
          ./tools/build_web.sh
      - name: Upload LCE browser game
        if: steps.source.outputs.available == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: lce-web-fix63-browser
          path: |
            lce-web-work/build-web/
          retention-days: 14
          compression-level: 1
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: steps.source.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lce-web-build-logs
          path: |
            lce-web-work/web-build-all.log
            lce-web-work/ruffle-build.log
          if-no-files-found: ignore
          retention-days: 14
