name: Build IR Music Sync APK

on:
  workflow_dispatch:
  push:
    branches: [android-ir-music-sync]
    paths:
      - 'IrMusicSync/**'
      - '.github/workflows/build-ir-music-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IrMusicSync/**'
      - '.github/workflows/build-ir-music-sync.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p IrMusicSync assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IR-Music-Sync-debug
          path: IrMusicSync/app/build/outputs/apk/debug/app-debug.apk
