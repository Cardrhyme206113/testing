name: Build Parallax Wallpaper APK

on:
  push:
    branches: [parallax-wallpaper-android]
    paths:
      - 'parallax-wallpaper/**'
      - '.github/workflows/parallax-wallpaper-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parallax-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-wallpaper-debug-apk
          path: parallax-wallpaper/app/build/outputs/apk/debug/app-debug.apk
