name: LCE Web fix65 UI build and playtest
on:
  push:
    branches: [lce-web-ui-audit-20261015]
    paths: ['.github/workflows/lce-fix65-disabled-after-staging.yml']
permissions:
  contents: read
jobs:
  build-and-playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          actions-cache-folder: emsdk-cache
      - name: Fetch and reconstruct fix64 source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, concurrent.futures, urllib.request, hashlib, zipfile
          urls=[]  # signed source links deliberately retired after fix65 source verification
          folder=pathlib.Path('source-parts');folder.mkdir(exist_ok=True)
          def get(i):
              request=urllib.request.Request(urls[i],headers={'User-Agent':'LCE-UI-Fix64-CI'})
              with urllib.request.urlopen(request,timeout=180) as f:data=f.read()
              if i<13 and len(data)!=15728640: raise Exception('Invalid part size '+str(i))
              (folder/f'part_{i:02d}').write_bytes(data)
              return len(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              print('Parts',list(pool.map(get,range(len(urls)))))
          output=pathlib.Path('source.zip')
          with output.open('wb') as dest:
              for p in sorted(folder.glob('part_*')):
                  with p.open('rb') as src:
                      while b:=src.read(1048576):dest.write(b)
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          if digest!='81d502ccb8d21cbf0af4ca5f099a45fed1a75fb2880fd1c1549a73e2e2c7b8fa':raise SystemExit('CHECKSUM FAILURE '+digest)
          print('Source SHA-256 verified',digest)
          with zipfile.ZipFile(output) as z:
              names=z.namelist()
              if not all(n.startswith('lce-web-work/') for n in names):raise SystemExit('Wrong ZIP root')
              if z.testzip() is not None:raise SystemExit('Bad archive')
              z.extractall('.')
          PY
          test -f lce-web-work/tools/playtest_ui_matrix.cjs
      - name: Apply validated fix65 source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          changes = {
              'Minecraft.Client/Web/Web_DemoMain.cpp': [
                  ('namespace {\\n#ifndef __EMSCRIPTEN__', '#ifdef __EMSCRIPTEN__\\n// Forward declaration must have the same linkage/scope as its definition\\n// below the anonymous startup namespace (verified by wasm-ld, fix64).\\nstatic void serviceUiTestRequest();\\n#endif\\n\\nnamespace {\\n#ifndef __EMSCRIPTEN__'),
                  ('int g_uiTestLastResult = -99;\\nstatic void serviceUiTestRequest();', 'int g_uiTestLastResult = -99;')
              ],
              'Minecraft.Client/Common/UI/UIScene_MainMenu.cpp': [
                  ('ui.NavigateToScene(m_iPad,eUIScene_SettingsMenu);\\n\\t\\treturn;', '// Preserve the original LCE Help & Options hierarchy on Web.\\n\\t\\tui.NavigateToScene(m_iPad,eUIScene_HelpAndOptionsMenu);\\n\\t\\treturn;')
              ],
              'tools/playtest_ui_matrix.cjs': [
                  ('![1,3,18,20].includes(c.type)','![1,2,3,17,18,19,20].includes(c.type)')
              ]
          }
          expected={
            'Minecraft.Client/Web/Web_DemoMain.cpp':'d11a620159c5f5788baa2ba7a29da75810d017eec4fc209c16824520da696146',
            'Minecraft.Client/Common/UI/UIScene_MainMenu.cpp':'3c8ebcdd38ac4e8bc7d438eb19377679ab45add4d6d473e8d716276dd54c4e2d',
            'tools/playtest_ui_matrix.cjs':'da481ce1503212f73be9ccf05f3e8de77220006bac1473fa55461b54955fab9a'
          }
          for name,repls in changes.items():
              p=pathlib.Path('lce-web-work')/name
              s=p.read_text()
              for old,new in repls:
                  old=old.encode().decode('unicode_escape')
                  new=new.encode().decode('unicode_escape')
                  if s.count(old)!=1: raise SystemExit(f'Unexpected patch context for {name}')
                  s=s.replace(old,new)
              p.write_text(s)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=expected[name]:raise SystemExit(f'Wrong patched SHA: {name}: {got}')
              print('Verified fix65 file',name,got)
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake clang pkg-config zlib1g-dev libpng-dev
          rustup target add wasm32-unknown-unknown
      - name: Build patched Ruffle
        working-directory: lce-web-work
        shell: bash
        run: bash ./tools/build_ruffle_webiggy.sh 2>&1 | tee ruffle64.log
      - name: Build fix64 game
        working-directory: lce-web-work
        shell: bash
        run: bash ./tools/build_web.sh
      - name: Export browser game
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lce-fix65-browser
          path: |
            lce-web-work/build-web/*.html
            lce-web-work/build-web/*.js
            lce-web-work/build-web/*.wasm
            lce-web-work/build-web/*.data
            lce-web-work/build-web/*.css
            lce-web-work/build-web/*.swf
            lce-web-work/build-web/vendor/ruffle/
            lce-web-work/build-web/ui-assets/
            lce-web-work/build-web/audio-opus/
          compression-level: 1
          retention-days: 10
          if-no-files-found: error
      - name: Setup Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run UI menu/control matrix
        working-directory: lce-web-work
        shell: bash
        env:
          UI_TEST_OUT: ../ui-playtest-results
          UI_BOOT_MS: '32000'
        run: |
          python3 tools/serve_web.py build-web > ../ui-test-server.log 2>&1 &
          sleep 3
          curl -fsSI http://127.0.0.1:8000/lce_web_demo.html | head -20
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          timeout 2100 node tools/playtest_ui_matrix.cjs 2>&1 | tee ../ui-test-runner.log
      - name: Upload matrix screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lce-fix65-ui-playtest-results
          path: |
            ui-playtest-results/
            ui-test-server.log
            ui-test-runner.log
            lce-web-work/ruffle64.log
            lce-web-work/web-build-all.log
          retention-days: 10
          if-no-files-found: ignore
