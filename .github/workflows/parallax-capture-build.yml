name: Build Parallax Capture

on:
  push:
    branches: [parallax-capture-mod]
    paths:
      - 'parallax-capture/**'
      - '.github/workflows/parallax-capture-build.yml'
  pull_request:
    branches: [parallax-capture-mod]
    paths:
      - 'parallax-capture/**'
      - '.github/workflows/parallax-capture-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parallax-capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-fabric-1.20.1
          path: |
            parallax-capture/build/libs/parallax-capture-*.jar
            !parallax-capture/build/libs/*-sources.jar
