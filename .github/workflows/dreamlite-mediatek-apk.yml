name: DreamLite MTK Android debug APK
on:
  push:
    branches:
      - feature/dreamlite-mediatek-android
    paths:
      - 'dreamlite-android/**'
      - '.github/workflows/dreamlite-mediatek-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'dreamlite-android/**'
      - '.github/workflows/dreamlite-mediatek-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: dreamlite-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dreamlite-mtk-debug-apk
          path: dreamlite-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
