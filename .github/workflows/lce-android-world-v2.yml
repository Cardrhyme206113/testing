name: LCE Native Android - textured world v0.2
on:
  workflow_dispatch:
  push:
    branches: [lce-android-arm64-world-v2-20261017]
    paths:
      - 'android-lce/**'
      - '.github/workflows/lce-android-world-v2.yml'
permissions: {contents: read}
jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-lce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Configure SDK
        run: |
          export SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install Android NDK SDK and CMake
        run: |
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Host-side original archive reader test
        run: |
          python3 tests/make_fixture.py tests/fixture.arc
          g++ -std=c++17 -Wall -Wextra -pedantic app/src/main/cpp/archive_reader.cpp tests/test_archive.cpp -o /tmp/lce-archive-test
          /tmp/lce-archive-test tests/fixture.arc
      - name: Host-side voxel world, terrain mesh and save/load tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic app/src/main/cpp/voxel_world.cpp tests/test_world.cpp -o /tmp/lce-world-test
          /tmp/lce-world-test
      - name: Compile ARM64 GLES3 LCE native APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify real AArch64 native library in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/liblceandroid.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/liblceandroid.so'
          unzip -p "$APK" lib/arm64-v8a/liblceandroid.so | head -c 4 | od -An -tx1
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lce-android-native-world-v02-apk
          path: android-lce/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
  emulator-smoke:
    needs: android-native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lce-android-native-world-v02-apk
          path: emulator-apk
      - name: Permit KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android, launch native ARM-equivalent game and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install emulator-apk/app-debug.apk
            adb shell am start -n dev.card.lceandroid.world/dev.card.lceandroid.MainActivity
            sleep 16
            adb logcat -d -s LCENative:I AndroidRuntime:E > native-emulator.log
            cat native-emulator.log | tail -60
            if grep -q 'FATAL EXCEPTION' native-emulator.log; then exit 1; fi
            if ! grep -q 'World meshed:' native-emulator.log; then echo 'Missing native renderer frame'; exit 1; fi
            adb shell screencap -p /sdcard/world-proof.png
            adb pull /sdcard/world-proof.png world-proof.png
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lce-android-native-world-v02-emulator-evidence
          path: |
            native-emulator.log
            world-proof.png
          retention-days: 7
          if-no-files-found: ignore
