name: Build Shrink Android APK

on:
  push:
    branches: [shrink-hardware-compressor]
    paths:
      - 'ShrinkAndroid/**'
      - '.github/workflows/shrink-android-build.yml'
  pull_request:
    branches: [sharplayer-android]
    paths:
      - 'ShrinkAndroid/**'
      - '.github/workflows/shrink-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project
        run: |
          test -f ShrinkAndroid/settings.gradle.kts
          test -f ShrinkAndroid/app/build.gradle.kts
          grep -q 'FrameDropEffect.createDefaultFrameDropEffect' ShrinkAndroid/app/src/main/java/com/cardrhyme/shrink/HardwareVideoCompressor.kt
          grep -q '2.5f..25f' ShrinkAndroid/app/src/main/java/com/cardrhyme/shrink/MainActivity.kt
          grep -q 'listOf(720, 960, 1080, 1440, 2160)' ShrinkAndroid/app/src/main/java/com/cardrhyme/shrink/ShrinkViewModel.kt

      - name: Build debug APK
        working-directory: ShrinkAndroid
        shell: bash
        run: |
          set +e
          gradle --stacktrace --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          tail -n 350 build.log > build-tail.log
          exit $code

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shrink-hardware-compressor-build
          path: |
            ShrinkAndroid/app/build/outputs/apk/debug/*.apk
            ShrinkAndroid/build.log
            ShrinkAndroid/build-tail.log
          if-no-files-found: warn
          retention-days: 30
