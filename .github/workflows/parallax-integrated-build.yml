name: Build Native Parallax Capture

on:
  push:
    branches: [parallax-integrated-stock-v052-v57]
    paths:
      - 'parallax-integrated-stock/**'
      - '.github/workflows/parallax-integrated-build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct validated v0.5.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat parallax-integrated-stock/project.v4.b64.part* | base64 -d > /tmp/parallax-project.tgz
          echo 'd302b0d509215113c190445f59a9395580e255718c7180dd963696b0d5672c6a  /tmp/parallax-project.tgz' | sha256sum -c -
          mkdir -p /tmp/parallax-src
          tar -xzf /tmp/parallax-project.tgz -C /tmp/parallax-src

      - name: Reconstruct and apply pure-Java native overlay
        shell: bash
        run: |
          set -euo pipefail
          head -c 14000 parallax-integrated-stock/native-overlay.b64.part00 > /tmp/native-overlay.b64
          cat parallax-integrated-stock/native-overlay.b64.part01 >> /tmp/native-overlay.b64
          base64 -d /tmp/native-overlay.b64 > /tmp/native-overlay.tgz
          echo 'ac798eef19395b6f69964adc7d35944ded911c2ea99dbb9f871b5bc7531fd318  /tmp/native-overlay.tgz' | sha256sum -c -
          mkdir -p /tmp/native-overlay
          tar -xzf /tmp/native-overlay.tgz -C /tmp/native-overlay
          cp -a /tmp/native-overlay/src/main/. /tmp/parallax-src/parallax-capture/src/main/
          rm -f /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/PythonPathScreen.java
          rm -f /tmp/parallax-src/parallax-capture/src/main/resources/assets/parallaxcapture/backend/parallax-backend-v57-native-integrated.zip

      - name: Apply v0.6.1 virtual-camera + LTW hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat parallax-integrated-stock/hotfix061.b64.part* | base64 -d > /tmp/parallax-hotfix061.tgz
          echo '26b9168607cef5021c4621c0f4c1f285e5f3360aa2e4a59501d4645e7336033d  /tmp/parallax-hotfix061.tgz' | sha256sum -c -
          tar -xzf /tmp/parallax-hotfix061.tgz -C /tmp/parallax-src/parallax-capture
          grep '^mod_version=0.6.1-native-v57$' /tmp/parallax-src/parallax-capture/gradle.properties
          grep -F 'VirtualCamera.set' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/CaptureSession.java
          if grep -R -E 'sendChatCommand|tp @s' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/CaptureSession.java; then
            echo 'CaptureSession still contains a server-side teleport/command path' >&2
            exit 1
          fi
          if unzip -p /tmp/parallax-src/parallax-capture/src/main/resources/assets/parallaxcapture/shaderpacks/Parallax-Surface-ViewZ24-v2-Compat120.zip 'shaders/*.fsh' | grep -F 'gl_FragColor = texture2D(gtexture, texcoord) * glcolor;'; then
            echo 'Compat120 surface pack still contains the LTW undeclared-color form' >&2
            exit 1
          fi

      - name: Apply v0.6.2 size fix
        shell: bash
        run: |
          set -euo pipefail
          cat parallax-integrated-stock/sizefix062.b64.part* | base64 -d > /tmp/parallax-sizefix062.tgz
          echo '39986ab0b22eeaa6607940b7a47add55ea0c00c3c8422269194edee4bf772fe6  /tmp/parallax-sizefix062.tgz' | sha256sum -c -
          tar -xzf /tmp/parallax-sizefix062.tgz -C /tmp/parallax-src/parallax-capture
          grep '^mod_version=0.6.2-native-v57-sizefix$' /tmp/parallax-src/parallax-capture/gradle.properties
          grep -F 'MESH_MIN_TILE = 4' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/NativeSceneConverter.java
          grep -F 'MESH_GLOBAL_TRIANGLE_BUDGET = 1_200_000L' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/NativeSceneConverter.java
          grep -F 'ZstdOutputStream' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/NativeSceneConverter.java
          if grep -F 'raw-block-frame' /tmp/parallax-src/parallax-capture/src/main/java/dev/card/parallaxcapture/NativeSceneConverter.java; then
            echo 'Raw-block pseudo-compression still present' >&2
            exit 1
          fi
          uname -m
          java -version

      - name: Build Fabric mod
        working-directory: /tmp/parallax-src/parallax-capture
        run: gradle build --stacktrace

      - name: Inspect architecture-neutral JAR and real Zstd
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find /tmp/parallax-src/parallax-capture/build/libs -maxdepth 1 -name 'parallax-capture-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/NativeSceneConverter.class'
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/RendererCompat.class'
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/IntegratedConverter.class'
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/VirtualCamera.class'
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/mixin/CameraMixin.class'
          unzip -l "$JAR" | grep -F 'dev/card/parallaxcapture/mixin/GameRendererMixin.class'
          unzip -l "$JAR" | grep -F 'assets/parallaxcapture/shaderpacks/Iris-LinearDepth-Exporter-DH-Normal-Blocks.zip'
          unzip -l "$JAR" | grep -F 'assets/parallaxcapture/shaderpacks/Parallax-Surface-ViewZ24-v2.zip'
          unzip -l "$JAR" | grep -F 'assets/parallaxcapture/shaderpacks/Iris-LinearDepth-Exporter-DH-Normal-Blocks-Compat120.zip'
          unzip -l "$JAR" | grep -F 'assets/parallaxcapture/shaderpacks/Parallax-Surface-ViewZ24-v2-Compat120.zip'
          AIR=$(unzip -Z1 "$JAR" | grep -E '^META-INF/jars/aircompressor-2\.0\.3[^/]*\.jar$' | head -1)
          test -n "$AIR"
          unzip -p "$JAR" "$AIR" > /tmp/aircompressor.jar
          unzip -l /tmp/aircompressor.jar | grep -F 'io/airlift/compress/zstd/ZstdOutputStream.class'
          unzip -l /tmp/aircompressor.jar | grep -F 'io/airlift/compress/zstd/ZstdInputStream.class'
          if unzip -l "$JAR" | grep -E '\.(so|dll|dylib)$'; then
            echo 'Unexpected architecture-specific native library in outer JAR' >&2
            exit 1
          fi
          if unzip -l /tmp/aircompressor.jar | grep -E '\.(so|dll|dylib)$'; then
            echo 'Unexpected native library in embedded Airlift compressor' >&2
            exit 1
          fi
          if unzip -l "$JAR" | grep -F 'parallax-backend-v57-native-integrated.zip'; then
            echo 'Python backend must not ship in native build' >&2
            exit 1
          fi
          if unzip -p "$JAR" dev/card/parallaxcapture/CaptureSession.class | strings | grep -E 'sendChatCommand|tp @s'; then
            echo 'Built CaptureSession contains teleport/command strings' >&2
            exit 1
          fi
          cat > /tmp/ZstdSmoke.java <<'JAVA'
          import io.airlift.compress.zstd.ZstdInputStream;
          import io.airlift.compress.zstd.ZstdOutputStream;
          import java.io.*;
          import java.nio.file.*;
          public class ZstdSmoke {
            public static void main(String[] args) throws Exception {
              Path z=Path.of("/tmp/zstd-smoke.zst");
              byte[] block=new byte[1<<20];
              try(OutputStream o=new ZstdOutputStream(new BufferedOutputStream(Files.newOutputStream(z)))) {
                for(int i=0;i<16;i++) o.write(block);
              }
              if(Files.size(z) >= 1_000_000) throw new AssertionError("Zstd did not compress: "+Files.size(z));
              long n=0; byte[] b=new byte[1<<16];
              try(InputStream in=new ZstdInputStream(new BufferedInputStream(Files.newInputStream(z)))) {
                for(int r;(r=in.read(b))>=0;) { for(int i=0;i<r;i++) if(b[i]!=0) throw new AssertionError("roundtrip mismatch"); n+=r; }
              }
              if(n != 16L*(1<<20)) throw new AssertionError("roundtrip size "+n);
              System.out.println("Airlift Zstd roundtrip OK; 16 MiB -> "+Files.size(z)+" bytes");
            }
          }
          JAVA
          javac -cp /tmp/aircompressor.jar /tmp/ZstdSmoke.java
          java -cp /tmp:/tmp/aircompressor.jar ZstdSmoke

      - name: Minecraft client startup smoke
        if: matrix.arch == 'x64'
        shell: bash
        working-directory: /tmp/parallax-src/parallax-capture
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          set +e
          timeout 180s xvfb-run -a gradle runClient --no-daemon > /tmp/parallax-client.log 2>&1
          rc=$?
          set -e
          grep -F 'Installed bundled Parallax standard + GLSL120 compatibility exporters' /tmp/parallax-client.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            tail -200 /tmp/parallax-client.log
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-0.6.2-native-v57-sizefix-fabric-1.20.1-${{ matrix.arch }}
          path: |
            /tmp/parallax-src/parallax-capture/build/libs/parallax-capture-*.jar
            !/tmp/parallax-src/parallax-capture/build/libs/*-sources.jar
