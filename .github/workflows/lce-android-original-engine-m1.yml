name: LCE Android M1 original 4J engine probe
on:
  workflow_dispatch:
  push:
    branches: [lce-android-original-engine-m1-20261017]
    paths:
      - 'android-lce/**'
      - '.github/workflows/lce-android-original-engine-m1.yml'
permissions: {contents: read}
jobs:
  android-m1-platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-lce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Locate Android SDK
        run: |
          export SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -d "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install NDK SDK and CMake
        run: |
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Original-source integration gate
        run: |
          if test -f original-engine/staged/Random.cpp; then
             echo "Original 4J World sources staged"
             grep -q '"Random.cpp"' original-engine/staged/STAGING-MANIFEST.json
          else
             echo "::notice::No original user source in public repo. Native game probe reports NOT LINKED. This is NOT an original-engine validation."
          fi
      - name: Run native prototype and engine-integration tests
        run: |
          python3 tests/make_fixture.py tests/fixture.arc
          g++ -std=c++17 -Wall -Wextra -pedantic app/src/main/cpp/archive_reader.cpp tests/test_archive.cpp -o /tmp/lce-archive-test
          /tmp/lce-archive-test tests/fixture.arc
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic app/src/main/cpp/voxel_world.cpp tests/test_world.cpp -o /tmp/lce-world-test
          /tmp/lce-world-test
      - name: Compile JNI entry point for Android
        run: |
          gradle --no-daemon :app:assembleDebug
      - name: Inspect APK ABI
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/liblceandroid.so'
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lce-android-m1-platform-probe-not-original-engine-unless-staged
          path: android-lce/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
