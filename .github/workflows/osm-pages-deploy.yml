name: Deploy Ankara HQ viewer

on:
  workflow_run:
    workflows: ['Ankara HQ OSM build']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: osm-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out viewer branch
        uses: actions/checkout@v4
        with:
          ref: osm-compression-lab

      - name: Choose successful Ankara source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh run list --workflow osm-ankara-hq.yml --branch osm-compression-lab --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Assemble Ankara HQ site
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          set -euxo pipefail
          mkdir -p site/data tmp/pm tmp/results
          cp osm-compression/ankara-hq/viewer/index.html site/index.html

          gh run download "$SOURCE_RUN" -n ankara-hq-pmtiles -D tmp/pm
          gh run download "$SOURCE_RUN" -n ankara-hq-results -D tmp/results

          cp tmp/pm/ankara-hq.pmtiles site/data/ankara-hq.pmtiles
          cp tmp/results/summary.json site/data/summary.json
          cp tmp/results/summary.md site/data/summary.md
          cp tmp/results/ankara-z15.png site/data/ankara-z15.png
          cp tmp/results/ankara-z16.png site/data/ankara-z16.png
          touch site/.nojekyll
          du -sh site site/data/*

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
