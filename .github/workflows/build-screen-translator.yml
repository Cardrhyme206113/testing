name: Build screen translator

on:
  workflow_dispatch:
  push:
    branches:
      - feature/paddle-screen-translator
    paths:
      - "screen-translator/**"
      - ".github/workflows/build-screen-translator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "screen-translator/**"
      - ".github/workflows/build-screen-translator.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official PaddleOCR Android SDK
        run: |
          git clone --depth 1 https://github.com/PaddlePaddle/PaddleOCR.git vendor/PaddleOCR

      - name: Inject translator module
        run: |
          PPROOT="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android"
          cp -R "$GITHUB_WORKSPACE/screen-translator/android-module" "$PPROOT/screen-translator"
          printf '\ninclude(":screen-translator")\n' >> "$PPROOT/settings.gradle.kts"

      - name: Download PP-OCRv6 Small ONNX models
        run: |
          PPROOT="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android"
          mkdir -p "$PPROOT/ppocr-sdk/src/main/assets/models/det"
          mkdir -p "$PPROOT/ppocr-sdk/src/main/assets/models/rec"
          curl -L --fail --retry 4 --retry-delay 3 \
            -o "$PPROOT/ppocr-sdk/src/main/assets/models/det/inference.onnx" \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 --retry-delay 3 \
            -o "$PPROOT/ppocr-sdk/src/main/assets/models/rec/inference.onnx" \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 --retry-delay 3 \
            -o "$PPROOT/ppocr-sdk/src/main/assets/models/rec/inference.yml" \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.yml?download=true"

      - name: Build debug APK
        working-directory: vendor/PaddleOCR/deploy/ppocr-android
        run: |
          chmod +x gradlew
          ./gradlew :screen-translator:assembleDebug --stacktrace

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppocrv6-screen-translator-debug
          path: vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk"
          APK="$GITHUB_WORKSPACE/PP-OCRv6-Screen-Translator-v0.1.0.apk"
          TAG="screen-translator-v0.1.0"
          cp "$SOURCE" "$APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "PP-OCRv6 Screen Translator v0.1.0" \
              --notes "Android Japanese-to-English screen translator using PP-OCRv6 Small and Google ML Kit offline translation. Touch-through overlay; unchanged OCR text is cached instead of translated repeatedly."
          fi
