name: Build screen translator

on:
  workflow_dispatch:
  push:
    branches: [feature/paddle-screen-translator]
    paths: ["screen-translator/**", ".github/workflows/build-screen-translator.yml"]
  pull_request:
    branches: [main]
    paths: ["screen-translator/**", ".github/workflows/build-screen-translator.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare project
        run: |
          git clone --depth 1 https://github.com/PaddlePaddle/PaddleOCR.git vendor/PaddleOCR
          P="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android"
          cp -R screen-translator/android-module "$P/screen-translator"
          cp screen-translator/sdk-overrides/com/paddle/ocr/EngineConfig.kt "$P/ppocr-sdk/src/main/java/com/paddle/ocr/EngineConfig.kt"
          cp screen-translator/sdk-overrides/com/paddle/ocr/engine/ORTSessionManager.kt "$P/ppocr-sdk/src/main/java/com/paddle/ocr/engine/ORTSessionManager.kt"
          sed -i '/maven.aliyun.com/d' "$P/settings.gradle.kts"
          sed -i 's/opencv = "4.5.3"/opencv = "4.12.0"/' "$P/gradle/libs.versions.toml"
          sed -i 's/com.quickbirdstudios/org.opencv/' "$P/gradle/libs.versions.toml"
          printf '\ninclude(":screen-translator")\n' >> "$P/settings.gradle.kts"

      - name: Add fallback models
        run: |
          P="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android/ppocr-sdk/src/main/assets/models"
          mkdir -p "$P/det" "$P/rec" "$P/rec-small"
          curl -L --fail --retry 4 -o "$P/det/inference.onnx" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_det_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 -o "$P/rec/inference.onnx" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 -o "$P/rec/inference.yml" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.yml?download=true"
          curl -L --fail --retry 4 -o "$P/rec-small/inference.yml" "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/main/inference.yml?download=true"

      - name: Build and verify
        working-directory: vendor/PaddleOCR/deploy/ppocr-android
        run: |
          chmod +x gradlew
          ./gradlew :screen-translator:assembleDebug --stacktrace
          APK=screen-translator/build/outputs/apk/debug/screen-translator-debug.apk
          test "$(stat -c%s "$APK")" -le 41943040

      - uses: actions/upload-artifact@v4
        with:
          name: ppocrv6-small-realtime-translator-v0.2.0
          path: vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk

      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk
          B=PP-OCRv6-Small-Realtime-Translator-v0.2.0.apk
          cp "$A" "$B"
          gh release create screen-translator-v0.2.0 "$B" --target feature/paddle-screen-translator --title "Screen Translator v0.2.0" --notes "Full-res Small OCR, NNAPI FP16 fallback, 60 fps box tracking, vertical Japanese reconstruction, exact-box background-matched translations." || gh release upload screen-translator-v0.2.0 "$B" --clobber
