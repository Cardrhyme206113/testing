name: Build screen translator

on:
  workflow_dispatch:
  push:
    branches:
      - feature/paddle-screen-translator
    paths:
      - "screen-translator/**"
      - ".github/workflows/build-screen-translator.yml"
  pull_request:
    branches:
      - main
    paths:
      - "screen-translator/**"
      - ".github/workflows/build-screen-translator.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare PaddleOCR Android project
        run: |
          mkdir -p vendor/PaddleOCR
          git -C vendor/PaddleOCR init
          git -C vendor/PaddleOCR remote add origin https://github.com/PaddlePaddle/PaddleOCR.git
          git -C vendor/PaddleOCR fetch --depth 1 origin 211989f046cc1878460f9e65574690c00a127a1a
          git -C vendor/PaddleOCR checkout FETCH_HEAD
          PPROOT="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android"
          cp -R "$GITHUB_WORKSPACE/screen-translator/android-module" "$PPROOT/screen-translator"
          sed -i '/maven.aliyun.com/d' "$PPROOT/settings.gradle.kts"
          sed -i 's/opencv = "4.5.3"/opencv = "4.12.0"/' "$PPROOT/gradle/libs.versions.toml"
          sed -i 's/com.quickbirdstudios/org.opencv/' "$PPROOT/gradle/libs.versions.toml"
          printf '\ninclude(":screen-translator")\n' >> "$PPROOT/settings.gradle.kts"

      - name: Download PP-OCRv6 Tiny models
        run: |
          PPROOT="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android"
          mkdir -p "$PPROOT/ppocr-sdk/src/main/assets/models/det" "$PPROOT/ppocr-sdk/src/main/assets/models/rec"
          curl -L --fail --retry 4 -o "$PPROOT/ppocr-sdk/src/main/assets/models/det/inference.onnx" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_det_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 -o "$PPROOT/ppocr-sdk/src/main/assets/models/rec/inference.onnx" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.onnx?download=true"
          curl -L --fail --retry 4 -o "$PPROOT/ppocr-sdk/src/main/assets/models/rec/inference.yml" "https://huggingface.co/PaddlePaddle/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.yml?download=true"

      - name: Build compact arm64 APK
        working-directory: vendor/PaddleOCR/deploy/ppocr-android
        run: |
          chmod +x gradlew
          ./gradlew :screen-translator:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk"
          test "$(stat -c%s "$APK")" -le 41943040
          unzip -p "$APK" lib/arm64-v8a/libopencv_java4.so > /tmp/libopencv_java4.so
          readelf -lW /tmp/libopencv_java4.so | grep ' LOAD '
          test "$(readelf -lW /tmp/libopencv_java4.so | awk '/ LOAD / {print $NF}' | sort -n | head -1)" != "0x1000"

      - uses: actions/upload-artifact@v4
        with:
          name: ppocrv6-tiny-screen-translator-arm64-v0.1.5
          path: vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE="$GITHUB_WORKSPACE/vendor/PaddleOCR/deploy/ppocr-android/screen-translator/build/outputs/apk/debug/screen-translator-debug.apk"
          APK="$GITHUB_WORKSPACE/PP-OCRv6-Tiny-Screen-Translator-arm64-v0.1.5.apk"
          TAG="screen-translator-v0.1.5"
          cp "$SOURCE" "$APK"
          gh release create "$TAG" "$APK" --target feature/paddle-screen-translator --title "PP-OCRv6 Tiny Screen Translator v0.1.5" --notes "Uses official OpenCV 4.12.0 with 16 KB page alignment for Android 15 and 16." || gh release upload "$TAG" "$APK" --clobber
