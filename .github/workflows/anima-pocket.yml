name: Anima Pocket Android
on:
  push:
    branches: [anima-pocket]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android NDK and shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers ninja-build
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Check out upstream inference engine
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/leejet/stable-diffusion.cpp.git anima-pocket/app/src/main/cpp/stable-diffusion.cpp
          cd anima-pocket/app/src/main/cpp/stable-diffusion.cpp
          git fetch --depth 1 origin a77d3623180b2bc1886f3dd04c0aa04156a987ef
          git checkout --detach a77d3623180b2bc1886f3dd04c0aa04156a987ef
          git submodule update --init --recursive --depth 1
      - name: Instrument inference and patch GGML Vulkan Q4 matrix path
        run: python3 anima-pocket/app/src/main/cpp/instrument_upstream.py
      - name: Stage Vulkan SDK C and C++ headers
        run: |
          mkdir -p anima-pocket/app/src/main/cpp/vulkan-headers
          cp -a /usr/include/vulkan anima-pocket/app/src/main/cpp/vulkan-headers/
          if [ -d /usr/include/vk_video ]; then cp -a /usr/include/vk_video anima-pocket/app/src/main/cpp/vulkan-headers/; fi
          cp -a /usr/include/spirv anima-pocket/app/src/main/cpp/vulkan-headers/
      - name: Build optimized ARM64 APK (Release CMake + test signing)
        run: cd anima-pocket && gradle --no-daemon --max-workers=2 assembleRelease
      - name: Verify optimized signed APK exists
        run: |
          test -s anima-pocket/app/build/outputs/apk/release/app-release.apk
          unzip -l anima-pocket/app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/libanimabridge.so'
      - uses: actions/upload-artifact@v4
        with:
          name: AnimaPocket-v0.5.1-NPU-Transformer-Ops-ARM64
          path: anima-pocket/app/build/outputs/apk/release/app-release.apk
