name: Parallax ReplayMod Build

on:
  push:
    branches: [parallax-replaymod-v053]
  pull_request:
    branches: [parallax-surface-fusion-v051]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore consistent Parallax Capture v0.5.1 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .reconstructed/src
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          # Branch head contains only chunk_00 from an unfinished v0.5.2 repack.
          # Recover the original 3500-char v0.5.1 chunk_00 from the prefix copy,
          # then append the intact chunks 01..07.
          prefix=Path('parallax_capture_v051_project.tgz.b64').read_text(encoding='utf-8')
          prefix=re.sub(r'\s+', '', prefix)
          parts=[prefix[:3500]]
          for i in range(1,8):
              s=Path(f'pc051_chunks/chunk_{i:02d}').read_text(encoding='utf-8')
              parts.append(re.sub(r'\s+', '', s))
          text=''.join(parts)
          assert len(text)==24992, len(text)
          raw=base64.b64decode(text, validate=True)
          Path('.reconstructed/source.tgz').write_bytes(raw)
          PY
          gzip -t .reconstructed/source.tgz
          tar -xzf .reconstructed/source.tgz -C .reconstructed/src
          test -f .reconstructed/src/build.gradle
      - name: Apply v0.5.3 render-camera and ReplayMod overlay
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d parallax_replaymod_overlay_v053.tgz.b64 > .reconstructed/overlay.tgz
          gzip -t .reconstructed/overlay.tgz
          tar -xzf .reconstructed/overlay.tgz -C .reconstructed/src
          grep -R "render_camera_only" .reconstructed/src/src/main/java/dev/card/parallaxcapture/CaptureSession.java
          if grep -R "sendChatCommand" .reconstructed/src/src/main/java/dev/card/parallaxcapture/CaptureSession.java; then
            echo 'ERROR: network teleport command survived overlay' >&2
            exit 3
          fi
          echo '--- ReplayMod v0.5.3 source ---'
          grep -RIlE 'CaptureCameraOverride|ReplayModBridge|render_camera_only' .reconstructed/src/src/main --include='*.java' --include='*.json' | sort
      - name: Upload reconstructed v0.5.3 source
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-v053-source
          path: .reconstructed/src
          if-no-files-found: error
      - name: Build reconstructed mod
        working-directory: .reconstructed/src
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean build --stacktrace
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-v0.5.3-replay-camera
          path: .reconstructed/src/build/libs/*.jar
          if-no-files-found: error
