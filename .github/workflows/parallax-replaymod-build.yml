name: Parallax ReplayMod Build

on:
  push:
    branches: [parallax-replaymod-v053]
  pull_request:
    branches: [parallax-surface-fusion-v051]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore consistent Parallax Capture v0.5.1 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .reconstructed/src
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          # The branch head contains only chunk_00 from an unfinished v0.5.2
          # repack. Recover the original v0.5.1 chunk_00 from the prefix copy,
          # then append the still-v0.5.1 chunks 01..07.
          prefix=Path('parallax_capture_v051_project.tgz.b64').read_text(encoding='utf-8')
          prefix=re.sub(r'\s+', '', prefix)
          parts=[prefix[:3497]]
          for i in range(1,8):
              s=Path(f'pc051_chunks/chunk_{i:02d}').read_text(encoding='utf-8')
              parts.append(re.sub(r'\s+', '', s))
          text=''.join(parts)
          text=re.sub(r'[^A-Za-z0-9+/=]', '', text)
          text += '='*((-len(text))%4)
          raw=base64.b64decode(text, validate=False)
          Path('.reconstructed/source.tgz').write_bytes(raw)
          print('base64 chars',len(text),'tgz bytes',len(raw),'magic',raw[:16])
          PY
          gzip -t .reconstructed/source.tgz
          tar -xzf .reconstructed/source.tgz -C .reconstructed/src
          test -f .reconstructed/src/build.gradle
          echo '--- reconstructed tree ---'
          find .reconstructed/src -maxdepth 8 -type f | sort | head -300
          echo '--- likely capture sources ---'
          grep -RIlE 'capture|Camera|GameRenderer|screenshot|pose_' .reconstructed/src --include='*.java' | sort | head -100 || true
      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-source
          path: .reconstructed/src
          if-no-files-found: error
      - name: Build reconstructed mod
        working-directory: .reconstructed/src
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean build --stacktrace
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-replaymod
          path: .reconstructed/src/build/libs/*.jar
          if-no-files-found: error
