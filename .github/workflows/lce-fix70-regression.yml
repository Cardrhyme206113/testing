name: LCE Web / Fix70 full UI regression
on:
  push:
    branches: [lce-web-ci-20261014]
    paths: [".github/workflows/lce-fix70-regression.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for compiled fix70
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run=38747364200
          for i in {1..110}; do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.status')
            conclusion=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion // ""')
            echo "Build $run $status $conclusion"
            if [ "$status" = completed ]; then test "$conclusion" = success; exit $?; fi
            sleep 25
          done
          exit 1
      - name: Download fix70 browser artifact
        uses: actions/download-artifact@v4
        with:
          repository: Cardrhyme206113/testing
          run-id: 38747364200
          name: lce-web-fix63-browser
          github-token: ${{ github.token }}
          path: site
      - name: Set up headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run original UI visual regression
        shell: bash
        run: |
          mkdir -p fix70-visual-results
          cat > playtest-server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
            def end_headers(self):
              self.send_header('Cross-Origin-Opener-Policy','same-origin')
              self.send_header('Cross-Origin-Embedder-Policy','require-corp')
              self.send_header('Cross-Origin-Resource-Policy','same-origin')
              self.send_header('Cache-Control','no-store')
              super().end_headers()
            def guess_type(self,path):
              if path.endswith('.wasm'):return 'application/wasm'
              if path.endswith('.data'):return 'application/octet-stream'
              return super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',8000),H).serve_forever()
          PY
          (cd site && python3 ../playtest-server.py > ../fix70-visual-results/server.log 2>&1) &
          sleep 2
          curl -sSIf http://127.0.0.1:8000/lce_web_demo.html
          UI_TEST_OUT=fix70-visual-results timeout 390s node tools/lce-visual-fix67.cjs 2>&1 | tee fix70-visual-results/output.log

      - name: Run full UI scene and control matrix
        if: success()
        shell: bash
        run: |
          mkdir -p fix70-matrix-results
          UI_TEST_URL=http://127.0.0.1:8000/lce_web_demo.html UI_TEST_OUT=fix70-matrix-results UI_BOOT_MS=30000 timeout 2300s node tools/lce-ui-playtest.cjs > fix70-matrix-results/matrix.log 2>&1 || echo "::warning::Some UI matrix cases did not complete; inspect evidence."

      - name: Upload screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lce-fix70-ui-evidence
          path: |
            fix70-visual-results/
            fix70-matrix-results/
          retention-days: 14
          compression-level: 1
          if-no-files-found: warn
