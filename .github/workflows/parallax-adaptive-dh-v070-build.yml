name: Parallax Adaptive DH Build

on:
  push:
    branches: [parallax-adaptive-dh-v070]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct Parallax Capture v0.6 source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .reconstructed/src
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          prefix=Path('parallax_capture_v051_project.tgz.b64').read_text(encoding='utf-8')
          prefix=re.sub(r'\s+', '', prefix)
          parts=[prefix[:3500]]
          for i in range(1,8):
              s=Path(f'pc051_chunks/chunk_{i:02d}').read_text(encoding='utf-8')
              parts.append(re.sub(r'\s+', '', s))
          text=''.join(parts)
          assert len(text)==24992, len(text)
          Path('.reconstructed/source.tgz').write_bytes(base64.b64decode(text, validate=True))
          PY
          gzip -t .reconstructed/source.tgz
          tar -xzf .reconstructed/source.tgz -C .reconstructed/src

          base64 -d parallax_replaymod_overlay_v053.tgz.b64 > .reconstructed/replay-overlay.tgz
          gzip -t .reconstructed/replay-overlay.tgz
          tar -xzf .reconstructed/replay-overlay.tgz -C .reconstructed/src

          cd .reconstructed/src
          patch -p1 < ../../parallax_hotkey_v054.patch
          cd ../..

          cat pc055_chunks/chunk_* | tr -d '\r\n' | base64 -d > .reconstructed/v055-overlay.tgz
          gzip -t .reconstructed/v055-overlay.tgz
          tar -xzf .reconstructed/v055-overlay.tgz -C .reconstructed/src

          cat exact_v060_patch/chunk_* > .reconstructed/exact_v060.patch
          cd .reconstructed/src
          patch --batch -p4 < ../exact_v060.patch
          patch --batch -p0 < ../../exact_v060_transfer_fix.patch
          cd ../..

      - name: Apply v0.7 adaptive DH implementation
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d parallax_v070_adaptive_dh.patch.gz.b64 | gzip -d > .reconstructed/v070.patch
          cd .reconstructed/src
          patch --batch -p1 < ../v070.patch
          cd ../..

          base64 -d depthshader_adaptive_v3.b64 > .reconstructed/src/src/main/resources/assets/parallaxcapture/exporters/Iris-LinearDepth-Exporter-DH-Adaptive-v3.zip

          grep '^mod_version=0.7.0-adaptive-dh$' .reconstructed/src/gradle.properties
          test -s .reconstructed/src/src/main/java/dev/card/parallaxcapture/AdaptiveDepthShellExporter.java
          grep -R 'adaptiveDepthNearBlocks = 32.0' .reconstructed/src/src/main/java/dev/card/parallaxcapture/CaptureConfig.java
          grep -R 'distantHorizonsWaterSuppressed' .reconstructed/src/src/main/java/dev/card/parallaxcapture/CaptureSession.java
          unzip -p .reconstructed/src/src/main/resources/assets/parallaxcapture/exporters/Iris-LinearDepth-Exporter-DH-Adaptive-v3.zip '*/shaders/final.fsh' | grep 'MAX_DEPTH_BLOCKS = 32768.0'
          unzip -l .reconstructed/src/src/main/resources/assets/parallaxcapture/exporters/Iris-LinearDepth-Exporter-DH-Adaptive-v3.zip | grep 'dh_water.fsh'

      - name: Upload patched source diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: parallax-v070-patched-source-diagnostic
          path: .reconstructed/src
          if-no-files-found: error

      - name: Build Fabric 1.20.1 mod
        working-directory: .reconstructed/src
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon clean build --stacktrace
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-v0.7.0-adaptive-dh
          path: .reconstructed/src/build/libs/*.jar
          if-no-files-found: error

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: parallax-capture-v070-source
          path: .reconstructed/src
          if-no-files-found: error
