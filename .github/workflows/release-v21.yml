name: Publish BlockHost v21

on:
  push:
    branches: [paper-mobilejre-v20-build]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Publish GitHub release v21')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android native build tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Apply Android API and server-download compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/example/blockhost')
          p = root / 'ServerRepository.java'
          s = p.read_text()
          pairs = {
            'Files.readString(stateFile.toPath(), StandardCharsets.UTF_8)': 'FileIo.readUtf8(stateFile)',
            'Files.readString(file.toPath(), StandardCharsets.UTF_8)': 'FileIo.readUtf8(file)',
            'Files.writeString(file.toPath(), content, StandardCharsets.UTF_8)': 'FileIo.writeUtf8(file, content)',
            'Files.writeString(tmp.toPath(), state.toString(2), StandardCharsets.UTF_8)': 'FileIo.writeUtf8(tmp, state.toString(2))',
            'Files.writeString(stateFile.toPath(), state.toString(2), StandardCharsets.UTF_8)': 'FileIo.writeUtf8(stateFile, state.toString(2))',
            'Files.writeString(file.toPath(), text, StandardCharsets.UTF_8)': 'FileIo.writeUtf8(file, text)',
            'file.isFile() ? Files.readString(file.toPath(), StandardCharsets.UTF_8) : ""': 'file.isFile() ? FileIo.readUtf8(file) : ""',
          }
          for old, new in pairs.items():
            s = s.replace(old, new)
          p.write_text(s)

          p = root / 'BlockHostBackend.java'
          s = p.read_text()
          s = s.replace(
              '.put("buildToolsUrl", SpigotVersionProvider.BUILDTOOLS_URL)',
              '.put("serverSource", SpigotVersionProvider.PUFFERFISH_JOB)'
          )
          s = s.replace(
              '.put("serverSource", SpigotVersionProvider.PAPER_API)',
              '.put("serverSource", SpigotVersionProvider.PUFFERFISH_JOB)'
          )
          p.write_text(s)
          PY
          python3 scripts/patch-pufferfish-v21.py

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk BlockHost-native-v21.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          unzip -l BlockHost-native-v21.apk | grep -q 'lib/arm64-v8a/libblockhost_jvm.so'
          ! unzip -l BlockHost-native-v21.apk | grep -q 'libproot'
          ! unzip -l BlockHost-native-v21.apk | grep -q 'runtime-aarch64'
          sha256sum BlockHost-native-v21.apk | tee BlockHost-native-v21.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # BlockHost v21

          First GitHub release of the Android-native server backend.

          - ARM64 Android APK
          - Android-native OpenJDK 21 runtime downloaded on first setup
          - Ready server JAR download; no local compilation
          - Pufferfish preferred when an exact build exists
          - Stable Paper fallback through the current Paper downloads API
          - Manual `server.jar` import remains available
          - No Alpine, PRoot, QEMU, Maven, Git, or BuildTools runtime

          Install this APK over the previous BlockHost build to preserve existing app data, servers, and worlds.
          EOF

          if gh release view v21 >/dev/null 2>&1; then
            gh release upload v21 BlockHost-native-v21.apk BlockHost-native-v21.apk.sha256 --clobber
            gh release edit v21 --title "BlockHost v21" --notes-file release-notes.md --latest
          else
            gh release create v21 BlockHost-native-v21.apk BlockHost-native-v21.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "BlockHost v21" \
              --notes-file release-notes.md \
              --latest
          fi
