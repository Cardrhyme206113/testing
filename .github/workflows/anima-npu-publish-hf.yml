name: Publish existing Anima INT4 NPU blocks to Hugging Face
on:
  push:
    branches: [anima-pocket]
    paths: ['.github/workflows/anima-npu-publish-hf.yml']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful compile workflow run with the 28-block artifact"
        required: true
        default: "40016876462"
      hf_repo_id:
        description: "Hugging Face model repository (owner/name)"
        required: true
        default: "cardrhyme/anima-turbo-v1.1-mt6989-a16w4-experimental"

permissions:
  actions: read
  contents: read

jobs:
  upload-existing-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ inputs.hf_repo_id || 'cardrhyme/anima-turbo-v1.1-mt6989-a16w4-experimental' }}
    steps:
      - name: Verify Hugging Face write token is configured
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Set a fine-grained Hugging Face write token in repository Actions secret HF_TOKEN."
            exit 1
          fi

      - name: Download compiled artifact from previous workflow
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id || '40016876462' }}
          name: Anima-Turbo-v1.1-28-block-MT6989-A16W4-EXPERIMENTAL-NOT-END-TO-END
          path: model
          github-token: ${{ github.token }}

      - name: Check downloaded model files and original model license
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d = Path('model')
          manifest = json.loads((d / 'manifest.json').read_text())
          assert len(manifest['blocks']) == 28, 'Missing compiled transformer blocks'
          assert manifest['complete_transformer'] and not manifest['complete_image_generation']
          for block in manifest['blocks']:
              f = d / block['filename']
              assert f.is_file() and f.stat().st_size > 0, f'Missing {f}'
          print('Verified 28 compiled transformer blocks; not a full end-to-end model.')
          PY

      - name: Retrieve upstream model license text
        run: |
          curl -fL --retry 3 --retry-all-errors https://huggingface.co/circlestone-labs/Anima/resolve/main/LICENSE.md -o model/LICENSE.md
          test -s model/LICENSE.md

      - name: Add documentation and upstream license
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('model/README.md').write_text('''---
          license: other
          license_name: circlestone-non-commercial
          license_link: https://huggingface.co/circlestone-labs/Anima/blob/main/LICENSE.md
          tags:
          - executorch
          - mediatek
          - experimental
          ---

          # Anima Turbo v1.1 — experimental MT6989 A16W4 NPU transformer blocks

          This repository contains **28 compiled INT4-weight / FP16-activation transformer block delegates** for the MediaTek MT6989 NPU, created from the original [CircleStone Labs Anima](https://huggingface.co/circlestone-labs/Anima) FP16 weights.

          **NOT a standalone, end-to-end image generator.** A corresponding Android application must still integrate all 28 block calls with the model prelude, Qwen text conditioning, sampling and image decoding. The initial Anima Pocket APK only exercises individual NPU projections; it does not yet run these blocks as complete image generation.

          Use is subject to the original CircleStone Labs non-commercial license and any applicable NVIDIA upstream terms. Review the upstream license before redistribution or use. Attribution: CircleStone Labs, Anima / Anima Turbo v1.1, with upstream NVIDIA Cosmos derivative obligations.

          Files: 28 individual .pte modules and manifest.json.
          ''', encoding='utf-8')
          Path('model/NOTICE.txt').write_text('''The CircleStone Model is licensed by CircleStone Labs LLC under the CircleStone Non-Commercial License. Copyright CircleStone Labs LLC. IN NO EVENT SHALL CIRCLESTONE LABS LLC BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH USE OF THIS MODEL.

          Derivative modification notice: the original Anima Turbo v1.1 model weights were converted into 28 experimental MT6989-specific A16W4 INT4-weight / FP16-activation ExecuTorch modules. This is a third-party experiment and is NOT an official, validated, or endorsed CircleStone Labs release. License rights are granted directly by CircleStone Labs under the attached LICENSE.md, not by the uploader.
          ''', encoding='utf-8')
          PY

      - name: Upload extracted model files to private Hugging Face repository
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub>=0.34,<2"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = os.environ['HF_REPO_ID']
          api.create_repo(repo_id=repo_id, repo_type='model', private=True, exist_ok=True)
          api.upload_folder(folder_path='model', repo_id=repo_id, repo_type='model', commit_message='Upload 28 compiled MT6989 A16W4 transformer blocks')
          print('Model uploaded to https://huggingface.co/' + repo_id)
          PY

      - name: Upload location
        run: |
          echo "### Uploaded experimental transformer blocks" >> "$GITHUB_STEP_SUMMARY"
          echo "Private model repository: https://huggingface.co/$HF_REPO_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "These 28 blocks do not yet enable full image generation in Anima Pocket." >> "$GITHUB_STEP_SUMMARY"

# Trigger existing-model upload after secure HF_TOKEN setup.
