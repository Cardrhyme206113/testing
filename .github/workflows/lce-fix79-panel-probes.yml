name: LCE Web / Fix79 isolate original scale9 backgrounds
on:
  push:
    branches: [lce-fix79-frame-renderer-20261015]
    paths: ['.github/workflows/lce-fix79-panel-probes.yml','tools/lce-fix79-panel-probes.cjs']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/download-artifact@v4
        with:
          repository: Cardrhyme206113/testing
          run-id: 38782615512
          name: lce-web-fix78-playable
          github-token: ${{ github.token }}
          path: site
      - name: Install Chromium and validate test script
        run: |
          node --check tools/lce-fix79-panel-probes.cjs
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start real browser build
        run: |
          cat > local_server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
            def end_headers(self):
              for k,v in [('Cross-Origin-Opener-Policy','same-origin'),('Cross-Origin-Embedder-Policy','require-corp'),('Cache-Control','no-store')]:self.send_header(k,v)
              super().end_headers()
            def guess_type(self,p):
              if p.endswith('.wasm'):return 'application/wasm'
              if p.endswith('.data'):return 'application/octet-stream'
              return super().guess_type(p)
          ThreadingHTTPServer(('127.0.0.1',8000),H).serve_forever()
          PY
          (cd site && python3 ../local_server.py > ../server.log 2>&1) &
          sleep 2
          curl -fIsS http://127.0.0.1:8000/lce_web_demo.html
      - name: Capture real SWF BackgroundPanel baseline and hidden-only variants
        shell: bash
        run: |
          set -o pipefail
          timeout 250s node tools/lce-fix79-panel-probes.cjs | tee fix79-panel.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lce-fix79-panel-source-vis-comparisons
          path: |
            fix79-panel-probes/
            fix79-panel.log
          retention-days: 14
          compression-level: 1
      - name: Publish test screenshots to isolated branch
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=sorted(Path('fix79-panel-probes').glob('*.png'))
          s=['# Original scale9 frame isolation tests','','Each screenshot uses the original SWF; only the indicated original Flash panel clip is temporarily hidden.','']
          for p in a:s.extend([f'## {p.stem}',f'![{p.stem}]({p.name})',''])
          Path('fix79-panel-probes/README.md').write_text('\n'.join(s))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fix79-panel-probes/
          git commit -m "LCE: publish raw scale9 source renderer comparison screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
