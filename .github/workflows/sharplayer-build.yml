name: Build SharpLayer Android APK

on:
  push:
    branches: [sharplayer-android]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download Option D vision models
        shell: bash
        run: |
          set -euo pipefail
          assets='SharpLayerAndroid/app/src/main/assets'
          mkdir -p "$assets"
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite' \
            -o "$assets/midas.tflite"
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/latest/deeplab_v3.tflite' \
            -o "$assets/deeplab_v3.tflite"
          test $(stat -c%s "$assets/midas.tflite") -gt 1000000
          test $(stat -c%s "$assets/deeplab_v3.tflite") -gt 1000000
          ls -lh "$assets"

      - name: Fix exact analysis frame dimensions
        run: python3 SharpLayerAndroid/scripts/patch_exact_analysis_frames.py

      - name: Normalize encoder output frame rate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt')
          text = path.read_text()
          text = text.replace(
              'import androidx.media3.effect.Presentation\n',
              'import androidx.media3.effect.FrameDropEffect\nimport androidx.media3.effect.Presentation\n',
          )
          text = text.replace(
              'listOf<Effect>(Presentation.createForHeight(height)),',
              'listOf<Effect>(\n                    Presentation.createForHeight(height),\n                    FrameDropEffect.createDefaultFrameDropEffect(plan.frameRate.toFloat()),\n                ),',
          )
          text = text.replace(
              '                .setEffects(effects)\n                .setFrameRate(plan.frameRate)\n                .build()',
              '                .setEffects(effects)\n                .build()',
          )
          path.write_text(text)
          PY

      - name: Accept encoder bitrate overshoot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt')
          text = path.read_text()
          text = text.replace(
              '                if (measured <= ceil(target * 1.04).toInt()) {',
              '                if (true) {',
          )
          text = text.replace(
              '                            "Measured $measured kbps total · ${encoderPlan.frameRate} fps · " +',
              '                            "Measured $measured kbps total (requested $target kbps) · ${encoderPlan.frameRate} fps · " +',
          )
          path.write_text(text)
          PY

      - name: Apply v0.4 UI labels
        shell: bash
        run: |
          sed -i 's/SharpLayer Option D/SharpLayer Option D v0.4/' \
            SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt
          sed -i 's/Depth + segmentation + 10 Hz structural deltas/30 fps encoder preflight + 5 Hz motion-propagated deltas/' \
            SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt
          sed -i 's/10 updates\/sec, 1-second keyframes/5 updates\/sec, 2-second keyframes/' \
            SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt

      - name: Verify project
        run: |
          test -f SharpLayerAndroid/settings.gradle.kts
          test -f SharpLayerAndroid/app/build.gradle.kts
          test $(stat -c%s SharpLayerAndroid/app/src/main/assets/midas.tflite) -gt 1000000
          test $(stat -c%s SharpLayerAndroid/app/src/main/assets/deeplab_v3.tflite) -gt 1000000
          grep -q 'Frame normalization failed' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/codec/FastStructureAnalyzer.kt
          grep -q 'SharpLayer Option D v0.4' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt
          grep -q 'Encoder preflight' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt
          grep -q 'FrameDropEffect.createDefaultFrameDropEffect(plan.frameRate.toFloat())' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt
          grep -q 'if (true)' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt
          ! grep -q 'ffmpeg-kit' SharpLayerAndroid/app/build.gradle.kts
          ! grep -q 'setFrameRate(plan.frameRate)' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/export/OptionDExportEngine.kt
          find SharpLayerAndroid -maxdepth 5 -type f | sort

      - name: Build debug APK
        working-directory: SharpLayerAndroid
        shell: bash
        run: |
          set +e
          gradle --stacktrace --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          tail -n 300 build.log > build-tail.log
          exit $code

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SharpLayer-v0.4-accept-overshoot-build
          path: |
            SharpLayerAndroid/app/build/outputs/apk/debug/*.apk
            SharpLayerAndroid/build.log
            SharpLayerAndroid/build-tail.log
          if-no-files-found: warn
          retention-days: 30
