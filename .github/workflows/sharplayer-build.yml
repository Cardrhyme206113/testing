name: Build SharpLayer Android APK

on:
  push:
    branches: [sharplayer-android]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download Option D vision models
        shell: bash
        run: |
          set -euo pipefail
          assets='SharpLayerAndroid/app/src/main/assets'
          mkdir -p "$assets"
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/isl-org/MiDaS/releases/download/v2_1/model_opt.tflite' \
            -o "$assets/midas.tflite"
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/latest/deeplab_v3.tflite' \
            -o "$assets/deeplab_v3.tflite"
          test $(stat -c%s "$assets/midas.tflite") -gt 1000000
          test $(stat -c%s "$assets/deeplab_v3.tflite") -gt 1000000
          ls -lh "$assets"

      - name: Fix exact analysis frame dimensions
        run: python3 SharpLayerAndroid/scripts/patch_exact_analysis_frames.py

      - name: Apply fast mode UI labels
        shell: bash
        run: |
          sed -i 's/Depth + segmentation + 10 Hz structural deltas/Depth + segmentation + 5 Hz motion-propagated deltas/' \
            SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt
          sed -i 's/10 updates\/sec, 1-second keyframes/5 updates\/sec, 2-second keyframes/' \
            SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt

      - name: Verify project
        run: |
          test -f SharpLayerAndroid/settings.gradle.kts
          test -f SharpLayerAndroid/app/build.gradle.kts
          test $(stat -c%s SharpLayerAndroid/app/src/main/assets/midas.tflite) -gt 1000000
          test $(stat -c%s SharpLayerAndroid/app/src/main/assets/deeplab_v3.tflite) -gt 1000000
          grep -q 'Frame normalization failed' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/codec/FastStructureAnalyzer.kt
          grep -q '5 Hz motion-propagated deltas' SharpLayerAndroid/app/src/main/java/com/cardrhyme/sharplayer/ui/SharpLayerApp.kt
          find SharpLayerAndroid -maxdepth 5 -type f | sort

      - name: Build debug APK
        working-directory: SharpLayerAndroid
        shell: bash
        run: |
          set +e
          gradle --stacktrace --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          tail -n 300 build.log > build-tail.log
          exit $code

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SharpLayer-option-d-fast-framefix-build
          path: |
            SharpLayerAndroid/app/build/outputs/apk/debug/*.apk
            SharpLayerAndroid/build.log
            SharpLayerAndroid/build-tail.log
          if-no-files-found: warn
          retention-days: 30
