name: Build SharpLayer Android APK

on:
  push:
    branches: [sharplayer-android]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SharpLayerAndroid/**'
      - '.github/workflows/sharplayer-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project
        run: |
          test -f SharpLayerAndroid/settings.gradle.kts
          test -f SharpLayerAndroid/app/build.gradle.kts
          find SharpLayerAndroid -maxdepth 5 -type f | sort

      - name: Build debug APK
        working-directory: SharpLayerAndroid
        shell: bash
        run: |
          set +e
          gradle --stacktrace --no-daemon assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          tail -n 250 build.log > build-tail.log
          exit $code

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SharpLayer-build-output
          path: |
            SharpLayerAndroid/app/build/outputs/apk/debug/*.apk
            SharpLayerAndroid/build.log
            SharpLayerAndroid/build-tail.log
          if-no-files-found: warn
          retention-days: 30
