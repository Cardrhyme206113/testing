name: Export Parallax Reconstructed Sources

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct current source
        shell: bash
        run: |
          set -euo pipefail
          cat parallax-integrated-stock/project.v4.b64.part* | base64 -d > /tmp/base.tgz
          echo 'd302b0d509215113c190445f59a9395580e255718c7180dd963696b0d5672c6a  /tmp/base.tgz' | sha256sum -c -
          mkdir -p /tmp/src
          tar -xzf /tmp/base.tgz -C /tmp/src
          head -c 14000 parallax-integrated-stock/native-overlay.b64.part00 > /tmp/native.b64
          cat parallax-integrated-stock/native-overlay.b64.part01 >> /tmp/native.b64
          base64 -d /tmp/native.b64 > /tmp/native.tgz
          echo 'ac798eef19395b6f69964adc7d35944ded911c2ea99dbb9f871b5bc7531fd318  /tmp/native.tgz' | sha256sum -c -
          mkdir -p /tmp/native
          tar -xzf /tmp/native.tgz -C /tmp/native
          cp -a /tmp/native/src/main/. /tmp/src/parallax-capture/src/main/
          rm -f /tmp/src/parallax-capture/src/main/java/dev/card/parallaxcapture/PythonPathScreen.java
          rm -f /tmp/src/parallax-capture/src/main/resources/assets/parallaxcapture/backend/parallax-backend-v57-native-integrated.zip
          cat parallax-integrated-stock/hotfix061.b64.part* | base64 -d > /tmp/hotfix.tgz
          echo '26b9168607cef5021c4621c0f4c1f285e5f3360aa2e4a59501d4645e7336033d  /tmp/hotfix.tgz' | sha256sum -c -
          tar -xzf /tmp/hotfix.tgz -C /tmp/src/parallax-capture
          cat parallax-integrated-stock/sizefix062.b64.part* | base64 -d > /tmp/sizefix.tgz
          echo '39986ab0b22eeaa6607940b7a47add55ea0c00c3c8422269194edee4bf772fe6  /tmp/sizefix.tgz' | sha256sum -c -
          tar -xzf /tmp/sizefix.tgz -C /tmp/src/parallax-capture
          python3 parallax-integrated-stock/finalize-sizefix062.py /tmp/src/parallax-capture/src/main/java/dev/card/parallaxcapture/NativeSceneConverter.java
          tar -czf /tmp/parallax-current-source.tgz -C /tmp/src parallax-capture
      - uses: actions/upload-artifact@v4
        with:
          name: parallax-current-source
          path: /tmp/parallax-current-source.tgz
