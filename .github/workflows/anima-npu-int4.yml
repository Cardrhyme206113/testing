name: Anima NPU INT4 A16W4 - real projection experiment
on:
  push:
    branches: [anima-pocket]
    paths:
      - '.github/workflows/anima-npu-int4.yml'
      - 'anima-pocket/npu-export/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a16w4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NEUROPILOT_URL: https://s3.ap-southeast-1.amazonaws.com/mediatek.neuropilot.com/b1c485de-fca8-4b20-836a-8b33152a3609.gz
      NEUROPILOT_SHA256: 42155c3b25e9f9af1bef55534d0700835f32564a289e8cb1e44f0b2433ddab48
      ANIMA_URL: https://huggingface.co/circlestone-labs/Anima/resolve/main/split_files/diffusion_models/anima-turbo-v1.1.safetensors
      ANIMA_SHA256: fba11953276b57edf59d1dc4f1857ac05aa079c56f982b4d7c20298d57d3f7eb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: anima-pocket/npu-export/requirements.txt

      - name: Disk and memory preflight
        run: |
          df -h .
          free -h
          python - <<'PY'
          import shutil
          free = shutil.disk_usage('.').free
          print(f"Free bytes: {free:,}")
          if free < 9 * (1024**3):
              raise SystemExit("At least 9 GiB free required to install toolchain + 4.18GB FP16 file")
          PY

      - name: Install Python CPU compiler dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r anima-pocket/npu-export/requirements.txt
          python -m pip check
          df -h .

      - name: Download verified public NeuroPilot Express SDK and install converter
        run: |
          mkdir -p "$RUNNER_TEMP/mtk"
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/neuropilot.tar.gz" "$NEUROPILOT_URL"
          echo "$NEUROPILOT_SHA256  $RUNNER_TEMP/neuropilot.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/neuropilot.tar.gz" -C "$RUNNER_TEMP/mtk" --wildcards \
            '*/mtk_neuron-8.2.23-*.whl' '*/mtk_converter-8.13.0+public-cp310-*.whl'
          find "$RUNNER_TEMP/mtk" -name '*.whl' -print
          NEURON_WHL=$(find "$RUNNER_TEMP/mtk" -name 'mtk_neuron-8.2.23-*.whl' -print -quit)
          CONVERTER_WHL=$(find "$RUNNER_TEMP/mtk" -name 'mtk_converter-8.13.0+public-cp310-*.whl' -print -quit)
          test -n "$NEURON_WHL" && test -n "$CONVERTER_WHL"
          python -m pip install --no-cache-dir "$NEURON_WHL" "$CONVERTER_WHL"
          python -c "from executorch.backends.mediatek import NeuropilotPartitioner, NeuropilotQuantizer, Precision; print('A16W4 compiler imports OK:', Precision.A16W4)"
          df -h .

      - name: Compile synthetic A16W4 probe BEFORE downloading 4GB
        run: |
          python anima-pocket/npu-export/compile_probe.py --synthetic --device mt6989 --out out/synthetic-mt6989-a16w4.pte

      - name: Download original FP16 Anima Turbo v1.1 and verify hash
        run: |
          df -h .
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/anima-turbo-v1.1.safetensors" "$ANIMA_URL"
          echo "$ANIMA_SHA256  $RUNNER_TEMP/anima-turbo-v1.1.safetensors" | sha256sum -c -
          ls -lh "$RUNNER_TEMP/anima-turbo-v1.1.safetensors"
          df -h .

      - name: Compile one REAL Anima projection using NPU A16W4
        run: |
          python anima-pocket/npu-export/compile_probe.py \
            --checkpoint "$RUNNER_TEMP/anima-turbo-v1.1.safetensors" \
            --device mt6989 \
            --out out/anima-real-projection-mt6989-a16w4.pte

      - name: Summarize actual output and scope
        if: always()
        run: |
          echo '## MediaTek INT4 export experiment' >> "$GITHUB_STEP_SUMMARY"
          echo 'A16W4 = 16-bit activations, 4-bit weights. Device: MT6989 (Dimensity 9300+).' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This compiles **one real Anima weight projection**, NOT an entire diffusion transformer or an Android-ready image model.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          find out -maxdepth 1 -type f -printf '%f (%s bytes)\n' 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          df -h . >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anima-MT6989-A16W4-projection-experiment
          path: out/
          if-no-files-found: warn
          retention-days: 7
