name: Build FrameLift APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-gpu-framegen
    paths:
      - 'framegen/**'
      - 'FRAMEGEN_README.md'
      - '.github/workflows/framegen-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'framegen/**'
      - 'FRAMEGEN_README.md'
      - '.github/workflows/framegen-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assemble GLES engine source
        run: |
          J=framegen/app/src/main/java/com/cardrhyme/framegen/GpuFrameGenerator.java
          cat "$J.part1" "$J.part2" "$J.part3" > "$J"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: framegen
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --console=plain > /tmp/framelift-build.log 2>&1
          status=$?
          tail -n 320 /tmp/framelift-build.log
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: framelift-debug-v0.8
          path: framegen/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
