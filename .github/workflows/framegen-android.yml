name: Build FrameLift APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-gpu-framegen
    paths:
      - 'framegen-project.tar.gz.b64'
      - 'FRAMEGEN_README.md'
      - '.github/workflows/framegen-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'framegen-project.tar.gz.b64'
      - 'FRAMEGEN_README.md'
      - '.github/workflows/framegen-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract FrameLift source bundle
        run: |
          base64 --decode framegen-project.tar.gz.b64 > /tmp/framegen-project.tar.gz
          tar -xzf /tmp/framegen-project.tar.gz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: framegen
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: framelift-debug
          path: framegen/app/build/outputs/apk/debug/app-debug.apk
