plugins { id 'com.android.application' }
android {
  namespace 'dev.card.lceandroid'
  compileSdk 35
  ndkVersion '27.2.12479018'
  defaultConfig {
    applicationId 'dev.card.lceandroid'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '0.1-native-bootstrap'
    ndk { abiFilters 'arm64-v8a' }
    externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
  }
  externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
