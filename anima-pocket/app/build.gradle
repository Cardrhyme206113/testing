plugins { id 'com.android.application' }
android {
    namespace 'dev.card.anima'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.card.anima'
        minSdk 30
        targetSdk 34
        versionCode 11
        versionName '0.5.1-npu-transformer-ops'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Build Release native C++/-O optimizations while distributing
            // a test-signed APK. Not a production signing identity.
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
