plugins { id 'com.android.application' }
def pocketUiOnly = project.hasProperty('pocketUiOnly') && project.property('pocketUiOnly').toString() == 'true'
android {
    namespace 'dev.card.anima'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.card.anima'
        minSdk 30
        targetSdk 34
        versionCode 26
        versionName '0.6.14-live-preview'
        ndk { abiFilters 'arm64-v8a' }
        if (!pocketUiOnly) {
            externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    if (!pocketUiOnly) {
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    }
}
dependencies {
    if (file('libs/executorch.aar').exists()) {
        implementation files('libs/executorch.aar')
    } else {
        compileOnly 'org.pytorch:executorch-android:1.5.1'
    }
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
    implementation 'com.facebook.soloader:nativeloader:0.10.5'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}
