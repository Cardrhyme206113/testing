plugins { id 'com.android.application' }
android {
    namespace 'dev.card.anima'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.card.anima'
        minSdk 30
        targetSdk 34
        versionCode 17
        versionName '0.6.5-vendor-runtime-symbol-probe'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared' } }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Build Release native C++/-O optimizations while distributing
            // a test-signed APK. Not a production signing identity.
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}

dependencies {
    // Release builds with a locally compiled MediaTek-enabled AAR package the actual
    // NeuropilotBackend. Generic app CI compiles the UI but cannot run .pte files.
    if (file('libs/executorch.aar').exists()) {
        implementation files('libs/executorch.aar')
    } else {
        compileOnly 'org.pytorch:executorch-android:1.5.1'
    }
    implementation 'com.facebook.fbjni:fbjni:0.7.0'
    implementation 'com.facebook.soloader:nativeloader:0.10.5'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}
