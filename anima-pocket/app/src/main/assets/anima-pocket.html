<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Anima Pocket</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0e10;color:#ededee;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #b4b2ec;outline-offset:2px}button{border:0}svg{display:block}.app{width:100%;max-width:480px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#0d0e10}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:650;letter-spacing:-.6px}.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#aaa9e9;color:#16151f;font-size:19px;font-weight:800}.brand .light{font-weight:400;color:#777983}.iconbtn{display:grid;place-items:center;background:transparent;color:#858791;padding:8px}.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.previewwrap{padding:8px 16px 0}.preview{width:100%;aspect-ratio:1;max-height:min(43dvh,440px);margin:auto;border:1px solid #2c2d32;background:#17181b;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center}.preview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.empty{color:#4d5057}.barwrap{position:absolute;bottom:0;left:0;right:0;height:4px;background:#323339;display:none}.bar{height:100%;background:#adaaea;width:0;transition:width .2s}.stepbadge{position:absolute;top:12px;left:12px;background:#0009;border-radius:6px;padding:5px 10px;font-size:11px;letter-spacing:.03em;display:none}.meta{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;color:#85878e;font-size:12px}.meta-right{display:flex;gap:9px;align-items:center}.dot{width:4px;height:4px;border-radius:50%;background:#5b5d64}.space{flex:1;min-height:10px}.bottom{padding:0 16px calc(16px + env(safe-area-inset-bottom))}.promptbox{background:#181a1d;border:1px solid #2a2c30;border-radius:14px;padding:12px;margin-bottom:12px}.promptbox textarea{display:block;width:100%;min-height:93px;background:transparent;border:0;outline:0;resize:none;color:#ededee;font-size:15px;line-height:1.5}.promptbox textarea::placeholder{color:#65676f}.prompttools{display:flex;justify-content:flex-start;padding-top:4px}.prompttools button{color:#74767e;background:transparent;padding:4px}.action{height:58px;background:#b4b2ec;color:#191822;border-radius:13px;display:flex;overflow:hidden}.generate{flex:1;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;font-weight:650}.generate:active,.gear:active{background:#9d9bd5}.split{width:1px;background:#77759e66;margin:12px 0}.gear{width:61px;background:transparent;display:grid;place-items:center;color:inherit}.layer{display:none;position:absolute;inset:0;z-index:5;background:#0009;flex-direction:column;justify-content:flex-end}.backdrop{flex:1}.panel{background:#1a1b1e;border-top:1px solid #393a40;border-radius:24px 24px 0 0;max-height:90dvh;overflow:auto;padding:20px 22px calc(25px + env(safe-area-inset-bottom))}.handle{width:40px;height:4px;border-radius:5px;background:#4e5058;margin:0 auto 20px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:19px;font-weight:650;letter-spacing:-.4px}.section{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#777984;font-weight:650;margin:22px 0 7px}.section.first{margin-top:0}.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #2b2c30;min-height:56px}.srow .name{font-size:14px}.select,.filebutton,.number{background:#27292d;color:#eee;border:1px solid #3a3b40;border-radius:9px;padding:9px 12px;max-width:58%;min-width:0}.filebutton{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.toggle{width:42px;height:24px;border-radius:20px;background:#484a50;padding:3px;display:flex;align-items:center;flex:none}.toggle[data-on="true"]{background:#aaa9e9;justify-content:flex-end}.toggle:after{content:"";width:18px;height:18px;border-radius:50%;background:white}.number{width:150px;text-align:right}.steps{padding:15px 0;border-bottom:1px solid #2b2c30}.stepsline{display:flex;justify-content:space-between;margin-bottom:10px}.accent{color:#b6b4ed}input[type="range"]{width:100%;accent-color:#b9b8ee}.done{width:100%;margin-top:21px;border-radius:12px;background:#b4b2ec;color:#171620;font-weight:650;padding:14px}.seedbox{display:none;padding:12px 0;border-bottom:1px solid #2b2c30;justify-content:flex-end}.seedbox.visible{display:flex}.historygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.historygrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}.history-empty{color:#85878e;white-space:nowrap;grid-column:1/-1}.historypanel{min-height:180px}@media(min-width:600px){body{background:#08090a}.app{box-shadow:0 0 0 1px #25262a}}
</style>
</head>
<body>
<main class="app">
 <header class="top"><div class="brand"><div class="logo">a</div><span>anima<span class="light"> pocket</span></span></div><button id="historyBtn" class="iconbtn" aria-label="History"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg></button></header>
 <div class="previewwrap"><div class="preview"><canvas id="art" width="512" height="512"></canvas><div id="empty" class="empty"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="36" height="36" rx="9"/><circle cx="18" cy="18" r="4"/><path d="m8 35 12-12 8 8 5-5 8 8"/></svg></div><div id="stepBadge" class="stepbadge">1 / 3</div><div id="barWrap" class="barwrap"><div id="bar" class="bar"></div></div></div></div>
 <div class="meta"><span id="status">Ready</span><div class="meta-right"><span id="resLabel">512 × 512</span><span class="dot"></span><span id="stepsLabel">3 steps</span></div></div>
 <div class="space"></div>
 <div class="bottom"><div class="promptbox"><textarea id="prompt" rows="3" placeholder="Describe an image..."></textarea><div class="prompttools"><button id="clear" aria-label="Clear prompt"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div></div><div class="action"><button id="generate" class="generate"><svg id="bolt" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="m13 2-9 11h7l-1 9 10-12h-7z"/></svg><span id="generateText">Generate</span></button><div class="split"></div><button id="settingsBtn" class="gear" aria-label="Settings"><svg class="ic" width="23" height="23" viewBox="0 0 24 24"><path d="M9.7 3h4.6l.7 2.5 2.3 1.3 2.5-.6 2.2 3.9-1.8 1.9v2l1.8 1.9-2.2 3.9-2.5-.6-2.3 1.3-.7 2.5H9.7L9 20.5l-2.3-1.3-2.5.6L2 15.9 3.8 14v-2L2 10.1l2.2-3.9 2.5.6L9 5.5z" transform="translate(0,-1) scale(1,.94)"/><circle cx="12" cy="12" r="3.3"/></svg></button></div></div>
 <div class="layer" id="settingsLayer"><div class="backdrop" data-close="settingsLayer"></div><div class="panel"><div class="handle"></div><div class="panelhead"><span>Settings</span><button class="iconbtn" data-close="settingsLayer" aria-label="Close settings"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <div class="section first">Models</div><div class="srow"><span class="name">Anima</span><button class="filebutton" data-file="anima">Select model</button></div><div class="srow"><span class="name">Qwen</span><button class="filebutton" data-file="qwen">Select encoder</button></div><div class="srow"><span class="name">TAESD</span><button class="filebutton" data-file="taesd">Select decoder</button></div>
  <div class="srow"><span class="name">NPU blocks</span><button class="filebutton" data-file="npu">Choose folder</button></div>
  <div class="section">Seed</div><div class="srow"><span class="name">Random each time</span><button class="toggle" id="randomToggle" data-on="true" role="switch" aria-label="Random seed each generation" aria-checked="true"></button></div><div class="seedbox" id="seedBox"><input class="number" id="seed" type="number" min="0" max="4294967295" step="1" value="42" aria-label="Fixed seed"></div>
  <div class="section">Generation</div><div class="srow"><span class="name">Resolution</span><select class="select" id="resolution"><option>512 × 512</option><option>384 × 384</option></select></div><div class="steps"><div class="stepsline"><span>Steps</span><span class="accent" id="stepValue">3</span></div><input id="steps" type="range" min="1" max="12" value="3"></div><div class="srow"><span class="name">Preview</span><select class="select" id="previewMode"><option value="latent">Latent2RGB</option><option value="taesd">TAESD</option><option value="off">Off</option></select></div><div class="srow"><span class="name">Backend</span><select class="select" id="backend"><option>NPU + CPU</option><option>Vulkan</option><option>CPU</option></select></div><div class="srow"><span class="name">Qwen Vulkan</span><button class="toggle" id="qwenVulkan" data-on="false" aria-label="Qwen Vulkan" role="switch" aria-checked="false"></button></div><div class="srow"><span class="name">Flash attention</span><button class="toggle" id="flash" data-on="true" role="switch" aria-checked="true"></button></div><div class="section">Diagnostics</div><div class="srow"><button class="filebutton" id="copyLog">Copy log</button><button class="filebutton" id="savedLog">Saved run</button><button class="filebutton" id="shareLog">Share</button></div><button class="done" data-close="settingsLayer">Done</button></div></div>
 <div class="layer" id="historyLayer"><div class="backdrop" data-close="historyLayer"></div><div class="panel historypanel"><div class="panelhead"><span>History</span><button class="iconbtn" data-close="historyLayer" aria-label="Close history">✕</button></div><div class="historygrid" id="historyGrid"><span class="history-empty">No images yet</span></div></div></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), canvas=$('art'), ctx=canvas.getContext('2d');
const native=window.PocketAndroid || null;
let busy=false, total=3, random=true, latestSeed='', currentSrc='', generation=0, images=[];
const show=id=>$(id).style.display='flex',hide=id=>$(id).style.display='none';
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>hide(b.dataset.close)));
$('settingsBtn').onclick=()=>show('settingsLayer');
$('historyBtn').onclick=()=>{images=[];renderHistory();show('historyLayer');if(native)native.history()};
$('steps').oninput=e=>{$('stepValue').textContent=e.target.value;$('stepsLabel').textContent=e.target.value+' steps'};
$('resolution').onchange=e=>$('resLabel').textContent=e.target.value;
$('clear').onclick=()=>$('prompt').value='';
function toggle(button){const on=button.dataset.on!=='true';button.dataset.on=String(on);button.setAttribute('aria-checked',String(on));return on}
$('randomToggle').onclick=()=>{$('seedBox').classList.toggle('visible',!toggle($('randomToggle')))};
$('qwenVulkan').onclick=()=>toggle($('qwenVulkan'));
$('flash').onclick=()=>toggle($('flash'));
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{
 if(!native)return;
 const n={anima:0,qwen:1,taesd:2,npu:3}[b.dataset.file];
 native.file(n);
});
$('copyLog').onclick=()=>native&&native.diagnostic('copy');
$('savedLog').onclick=()=>native&&native.diagnostic('saved');
$('shareLog').onclick=()=>native&&native.diagnostic('share');
function config(){return {
 prompt:$('prompt').value.trim(),steps:Number($('steps').value),
 resolution:$('resolution').value,preview:$('previewMode').value,backend:$('backend').value,
 random:$('randomToggle').dataset.on==='true',seed:$('seed').value.trim()||'42',
 qwenVulkan:$('qwenVulkan').dataset.on==='true',flash:$('flash').dataset.on==='true'
}}
$('generate').onclick=()=>{
 if(!native)return;
 if(busy){native.cancel();$('status').textContent='Stopping…';return}
 const settings=config();
 if(!settings.prompt){$('status').textContent='Enter a prompt';return}
 if(settings.backend==='NPU + CPU'&&settings.resolution!=='512 × 512'){
   $('status').textContent='NPU requires 512 × 512';return
 }
 native.generate(JSON.stringify(settings));
};
function paint(data){
 if(!data)return;
 const token=generation, picture=new Image();
 picture.onload=()=>{if(token!==generation)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(picture,0,0,canvas.width,canvas.height);
  hide('empty');canvas.style.display='block';
 };
 picture.src=data;
}
function renderHistory(){
 const grid=$('historyGrid');grid.replaceChildren();
 if(!images.length){const label=document.createElement('span');label.className='history-empty';label.textContent='No images yet';grid.append(label);return}
 images.forEach(entry=>{
  const image=document.createElement('img');image.src=entry.src;image.alt='Generated image';
  image.onclick=()=>{generation++;paint(entry.src);$('status').textContent='Saved image';hide('historyLayer')};
  grid.append(image);
 });
}
window.PocketNative={
 begin(steps,seed){generation++;busy=true;total=steps;latestSeed=seed;
  $('bolt').style.display='none';$('generateText').textContent='Stop';
  $('bar').style.width='0%';show('barWrap');show('stepBadge');
  $('stepBadge').textContent='0 / '+total;$('status').textContent='Generating';
 },
 busy(value){busy=value;if(!value){$('bolt').style.display='block';$('generateText').textContent='Generate';}
 },
 progress(done,all){$('bar').style.width=(100*Math.max(0,Math.min(1,done/all)))+'%';
   const step=Math.min(total,Math.floor(done/28));
   $('stepBadge').textContent=step+' / '+total;
   $('status').textContent='Generating · '+Math.round(done/all*100)+'%';
 },
 preview(data,step,count){if(!busy)return;
   paint(data);$('stepBadge').textContent=Math.max(1,step)+' / '+count;
   $('bar').style.width=100*Math.max(step/count,parseFloat($('bar').style.width)/100||0)+'%';
   $('status').textContent='Step '+step+' / '+count;
 },
 finished(data,seed,prompt){generation++;paint(data);latestSeed=seed;currentSrc=data;
   $('bar').style.width='100%';hide('stepBadge');hide('barWrap');
   $('status').textContent='Complete';busy=false;
   $('bolt').style.display='block';$('generateText').textContent='Generate';
 },
 historyItem(data,id){if(images.some(entry=>entry.id===id))return;images.push({src:data,id});renderHistory()},
 historyDone(){renderHistory()},
 file(n,name){const key=['anima','qwen','taesd','npu'][n];const b=document.querySelector('[data-file="'+key+'"]');if(b)b.textContent=name},
 status(s){if(!busy)return;if(s.startsWith('Preparing'))$('status').textContent='Preparing'},
 error(message){busy=false;$('bolt').style.display='block';$('generateText').textContent='Generate';hide('barWrap');hide('stepBadge');$('status').textContent=message||'Generation failed'}
};
if(native){
 try{const settings=JSON.parse(native.initial());
  $('prompt').value=settings.prompt||'';
  $('steps').value=String(settings.steps||3);$('steps').dispatchEvent(new Event('input'));
  $('resolution').value=settings.res||'512 × 512';$('resolution').dispatchEvent(new Event('change'));
  $('backend').value=settings.backend||'NPU + CPU';$('previewMode').value=settings.mode||'latent';
  for(let i=0;i<4;i++)window.PocketNative.file(i,settings['file'+i]||'Choose');
  const apply=(id,v)=>{const b=$(id);b.dataset.on=String(!!v);b.setAttribute('aria-checked',String(!!v))};
  apply('randomToggle',settings.seedRandom!==false);
  apply('qwenVulkan',settings.qwen===true);
  apply('flash',settings.flash!==false);
  $('seed').value=settings.seed||'42';
  $('seedBox').classList.toggle('visible',settings.seedRandom===false);
 }catch(e){$('status').textContent='Settings unavailable'}
}else{
 $('status').textContent='Preview only · open in Anima Pocket';
 $('generate').disabled=true;
}
})();
</script>
</body>
</html>
