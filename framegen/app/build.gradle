plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cardrhyme.framegen'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cardrhyme.framegen'
        minSdk 30
        targetSdk 36
        versionCode 9
        versionName '0.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
