<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MC WebStream</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font:14px system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;touch-action:none;user-select:none}
#video{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
#ui{position:absolute;z-index:2;left:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
.p{padding:6px 9px;background:#111d;border:1px solid #ffffff22;border-radius:8px;backdrop-filter:blur(3px)}
#hint{position:absolute;z-index:3;inset:0;display:grid;place-items:center;pointer-events:none}
#hint span{padding:10px 14px;background:#111e;border:1px solid #ffffff2d;border-radius:9px}
.locked #hint,.gui #hint{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="video" width="1280" height="720"></canvas>
  <div id="ui">
    <div class="p" id="net">connecting…</div>
    <div class="p" id="vid">AV1: waiting for encoder</div>
    <div class="p" id="mode">input: waiting</div>
  </div>
  <div id="hint"><span>Click to capture mouse</span></div>
</div>
<script>(()=>{'use strict';
const stage=document.querySelector('#stage');
const canvas=document.querySelector('#video');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const net=document.querySelector('#net');
const vid=document.querySelector('#vid');
const mode=document.querySelector('#mode');
const MAX_STREAM_PIXELS=1280*720;
let ws=null,wsPort=8765,decoder=null,codec='',frames=0,lastFrames=0,chunks=0,lastChunks=0,resizeTimer=0;
let screenOpen=true;
let cfg={width:1280,height:720,sourceWidth:1280,sourceHeight:720,fps:60,bitrateKbps:4000};

const special={Space:32,Quote:39,Comma:44,Minus:45,Period:46,Slash:47,Semicolon:59,Equal:61,BracketLeft:91,Backslash:92,BracketRight:93,Backquote:96,Escape:256,Enter:257,Tab:258,Backspace:259,Insert:260,Delete:261,ArrowRight:262,ArrowLeft:263,ArrowDown:264,ArrowUp:265,PageUp:266,PageDown:267,Home:268,End:269,CapsLock:280,ScrollLock:281,NumLock:282,PrintScreen:283,Pause:284,NumpadDecimal:330,NumpadDivide:331,NumpadMultiply:332,NumpadSubtract:333,NumpadAdd:334,NumpadEnter:335,NumpadEqual:336,ShiftLeft:340,ControlLeft:341,AltLeft:342,MetaLeft:343,ShiftRight:344,ControlRight:345,AltRight:346,MetaRight:347,ContextMenu:348};
function glfw(code){if(/^Key[A-Z]$/.test(code))return code.charCodeAt(3);if(/^Digit[0-9]$/.test(code))return code.charCodeAt(5);let m=/^F([1-9]|1\d|2[0-5])$/.exec(code);if(m)return 289+Number(m[1]);m=/^Numpad([0-9])$/.exec(code);if(m)return 320+Number(m[1]);return special[code]??-1}
function modifiers(e){return(e.shiftKey?1:0)|(e.ctrlKey?2:0)|(e.altKey?4:0)|(e.metaKey?8:0)}
function send(o){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function viewportTarget(){
  const dpr=Math.max(1,Number(devicePixelRatio)||1);
  let w=Math.max(64,Math.round(innerWidth*dpr));
  let h=Math.max(64,Math.round(innerHeight*dpr));
  const pixels=w*h;
  if(pixels>MAX_STREAM_PIXELS){const s=Math.sqrt(MAX_STREAM_PIXELS/pixels);w=Math.round(w*s);h=Math.round(h*s)}
  w=Math.max(64,w&~1);h=Math.max(64,h&~1);
  return{width:w,height:h};
}
function sendViewport(){send({type:'viewport',...viewportTarget()})}
function scheduleViewport(){clearTimeout(resizeTimer);resizeTimer=setTimeout(sendViewport,120)}

async function boot(){
  try{
    const c=await fetch('/config',{cache:'no-store'}).then(r=>r.ok?r.json():null);
    if(c?.wsPort)wsPort=c.wsPort;
    if(c){cfg={...cfg,...c};canvas.width=cfg.videoWidth||cfg.width||1280;canvas.height=cfg.videoHeight||cfg.height||720}
  }catch{}
  connect();
}
function connect(){
  const p=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${p}//${location.hostname}:${wsPort}/`);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{net.textContent='connected';sendViewport()};
  ws.onclose=()=>{net.textContent='disconnected — retrying';releaseAll();setTimeout(connect,1000)};
  ws.onerror=()=>net.textContent='socket error';
  ws.onmessage=e=>typeof e.data==='string'?handleJson(e.data):handleVideo(e.data);
}
function handleJson(text){
  let m;try{m=JSON.parse(text)}catch{return}
  if(m.type==='hello'){
    net.textContent=`connected · protocol ${m.protocol}`;
    return;
  }
  if(m.type==='ui-state'){
    screenOpen=!!m.screenOpen;
    stage.classList.toggle('gui',screenOpen);
    mode.textContent=screenOpen?`input: cursor${m.title?' · '+m.title:''}`:(document.pointerLockElement===stage?'input: captured':'input: click to capture');
    if(screenOpen&&document.pointerLockElement===stage)document.exitPointerLock();
    return;
  }
  if(m.type==='video-config')configureVideo(m);
}
async function configureVideo(c){
  cfg={...cfg,...c};
  canvas.width=c.width;
  canvas.height=c.height;
  if(!('VideoDecoder'in window)){
    vid.textContent='AV1 unavailable: browser has no WebCodecs VideoDecoder';
    return;
  }
  try{
    // Do not force prefer-hardware here. Firefox can report that hint as supported
    // even when the selected decoder cannot actually be initialized.
    const dc={codec:c.codec,codedWidth:c.width,codedHeight:c.height,optimizeForLatency:true};
    const supported=await VideoDecoder.isConfigSupported(dc);
    if(!supported.supported)throw Error(`AV1 decoder config unsupported (${c.codec})`);
    if(decoder)decoder.close();
    codec=c.codec;
    decoder=new VideoDecoder({
      output:frame=>{ctx.drawImage(frame,0,0,canvas.width,canvas.height);frame.close();frames++},
      error:e=>{vid.textContent='AV1 decode error: '+e.message;console.error(e)}
    });
    decoder.configure(dc);
    vid.textContent=`AV1 configured ${c.width}×${c.height}@${c.fps} · waiting for packets`;
  }catch(e){
    vid.textContent='AV1 unavailable: '+e.message;
    console.error(e);
  }
}
function handleVideo(buf){
  if(!(buf instanceof ArrayBuffer)||buf.byteLength<12)return;
  const d=new DataView(buf);
  if(d.getUint8(0)!==0x56)return;
  chunks++;
  const key=d.getUint8(2)!==0;
  const ts=Number(d.getBigInt64(4,false));
  if(!decoder||decoder.state!=='configured')return;
  if(decoder.decodeQueueSize>6&&!key)return;
  try{
    decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:ts,data:new Uint8Array(buf,12)}));
  }catch(e){
    vid.textContent='AV1 chunk error: '+e.message;
    console.error(e);
  }
}

function sourceNorm(e){
  let u=Math.max(0,Math.min(1,e.clientX/innerWidth));
  let v=Math.max(0,Math.min(1,e.clientY/innerHeight));
  const tw=cfg.width||1280,th=cfg.height||720,sw=cfg.sourceWidth||tw,sh=cfg.sourceHeight||th;
  const scale=Math.min(tw/sw,th/sh),cw=sw*scale,ch=sh*scale,px=(tw-cw)/2,py=(th-ch)/2;
  u=(u*tw-px)/cw;
  v=(v*th-py)/ch;
  return{xNorm:Math.max(0,Math.min(1,u)),yNorm:Math.max(0,Math.min(1,v))};
}

addEventListener('resize',scheduleViewport,{passive:true});
addEventListener('orientationchange',scheduleViewport,{passive:true});
stage.addEventListener('click',()=>{
  if(!screenOpen&&document.pointerLockElement!==stage)stage.requestPointerLock();
});
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===stage;
  stage.classList.toggle('locked',locked);
  if(!screenOpen)mode.textContent=locked?'input: captured':'input: click to capture';
});
document.addEventListener('mousemove',e=>{
  if(screenOpen){send({type:'mouse-move',relative:false,...sourceNorm(e)});return}
  if(document.pointerLockElement!==stage)return;
  send({type:'mouse-move',relative:true,dx:e.movementX,dy:e.movementY});
});
addEventListener('keydown',e=>{
  const k=glfw(e.code);if(k<0)return;
  e.preventDefault();
  send({type:'key',keyCode:k,action:e.repeat?2:1,modifiers:modifiers(e)});
  if(screenOpen&&e.key&&[...e.key].length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    send({type:'char',text:e.key,modifiers:modifiers(e)});
  }
});
addEventListener('keyup',e=>{
  const k=glfw(e.code);if(k<0)return;
  e.preventDefault();
  send({type:'key',keyCode:k,action:0,modifiers:modifiers(e)});
});
stage.addEventListener('mousedown',e=>{
  if(!screenOpen&&document.pointerLockElement!==stage)return;
  e.preventDefault();
  send({type:'mouse',button:e.button,action:1,modifiers:modifiers(e),...sourceNorm(e)});
});
addEventListener('mouseup',e=>{
  if(!screenOpen&&document.pointerLockElement!==stage)return;
  send({type:'mouse',button:e.button,action:0,modifiers:modifiers(e),...sourceNorm(e)});
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  send({type:'wheel',amount:-Math.sign(e.deltaY),...sourceNorm(e)});
},{passive:false});
stage.addEventListener('contextmenu',e=>e.preventDefault());
function releaseAll(){send({type:'release-all'})}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});

setInterval(()=>{
  const decoded=frames-lastFrames;lastFrames=frames;
  const packetRate=chunks-lastChunks;lastChunks=chunks;
  if(codec){
    vid.textContent=`AV1 ${cfg.width}×${cfg.height}@${cfg.fps} · ${cfg.bitrateKbps||'?'} kbps · packets ${packetRate}/s · decoded ${decoded}/s · q${decoder?.decodeQueueSize||0}`;
  }else if(chunks){
    vid.textContent=`AV1 packets arriving (${packetRate}/s), decoder not configured`;
  }
},1000);

boot();
})();</script>
</body>
</html>
